<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Anatómico 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa → barra superior flotante → panel de capas/explorador a la izquierda y ficha a la derecha (hojas inferiores en celular). Un solo aspecto oscuro, a propósito: imita una sala de disección con luz de estudio. */
:root{
  --bg:#070b12; --bg2:#0c131f; --panel:rgba(11,18,29,.9); --panel2:rgba(20,30,46,.85);
  --ink:#e7edf4; --muted:#8d9cb1; --faint:#5d6b80; --line:rgba(173,197,224,.12); --line2:rgba(173,197,224,.22);
  --accent:#5fd3e4; --accent-ink:#04222a; --ok:#6fd6a0; --bad:#ff8b7a;
  --mus:#d0574c; --lig:#bfdcea; --bone:#e8dcc2; --nerve:#f2c94c; --art:#e0483d; --vein:#4f7fe0;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-lat:"Newsreader",Georgia,"Times New Roman",serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lat{font:italic 400 15px/1.3 var(--f-lat);color:var(--muted)}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;background:radial-gradient(70% 60% at 55% 40%,#122036 0%,var(--bg) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* Barra superior */
.bar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--bg) 0%,rgba(7,11,18,.72) 70%,rgba(7,11,18,0));pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:conic-gradient(from 200deg,var(--mus),var(--nerve),var(--accent),var(--vein),var(--mus));display:grid;place-items:center;flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:3px;border-radius:8px;background:var(--bg)}
.mark svg{position:relative;z-index:1;width:20px;height:20px;stroke:var(--ink)}
.brand b{display:block;font-weight:600;font-size:14.5px;letter-spacing:.01em;line-height:1.15}
.reg{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer}
.search{position:relative;flex:1;max-width:520px;margin:0 auto;min-width:0}
.search input{width:100%;height:40px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);padding:0 16px 0 40px;font-size:14px;outline:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:14px;top:11.5px;color:var(--muted)}
.res{position:absolute;left:0;right:0;top:46px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);max-height:min(60vh,460px);overflow:auto;padding:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.res button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer}
.res button:hover,.res button.on{background:var(--panel2)}
.res b{font-weight:500;display:block}
.res button>span:nth-child(2){min-width:0}
.res small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .empty{padding:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.acts{display:flex;gap:6px;align-items:center}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:13px;font-weight:500;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .2s,background .2s}
.ib:hover{border-color:var(--accent)}
.ib.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.av.guest{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}

/* Paneles */
.panel{position:absolute;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
#left{left:max(14px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:84px;width:300px}
#right{right:max(14px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:84px;width:360px}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.tabs button .nb{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:2px}
.pbody{flex:1;overflow:auto;padding:14px 16px 18px;min-height:0}
.ph{font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.ph:first-child{margin-top:2px}
.close{display:none}

/* Capas */
.layer{display:grid;grid-template-columns:12px 1fr auto 38px;gap:10px;align-items:center;padding:7px 2px}
.layer b{font-weight:500}
.layer small{color:var(--faint);font-size:11.5px}
.sw{position:relative;width:38px;height:22px;border-radius:99px;border:0;background:var(--panel2);cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw.on{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.sw.on::after{transform:translateX(16px);background:var(--accent)}
.range{display:flex;align-items:center;gap:10px;padding:6px 2px}
.range input{flex:1;accent-color:var(--accent)}
.hidden-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:12.5px}

/* Explorar */
.filter{width:100%;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);padding:0 12px;outline:none;margin-bottom:6px}
.filter:focus{border-color:var(--accent)}
details.grp{border-bottom:1px solid var(--line)}
details.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 2px;font-weight:600}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary span{margin-left:auto;color:var(--faint);font:400 12px var(--f-mono)}
.sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px 2px}
.item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-radius:9px;cursor:pointer;color:var(--ink)}
.item:hover{background:var(--panel2)}
.item.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.item.off{color:var(--faint);text-decoration:line-through}
.item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item i.nd{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

/* Ficha */
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--panel2);font-size:11.5px;font-weight:500;color:var(--ink)}
.ficha h2{margin:8px 0 2px;font:600 24px/1.15 var(--f-ui);letter-spacing:-.01em;text-wrap:balance}
.ficha .lat{margin:0 0 10px}
.ficha p.res0{margin:0 0 12px;color:#cfd8e3}
.ftabs{display:flex;gap:4px;margin:4px 0 12px;border-bottom:1px solid var(--line)}
.ftabs button{border:0;background:none;padding:8px 10px 9px;color:var(--muted);cursor:pointer;font-weight:500;font-size:13px;position:relative}
.ftabs button.on{color:var(--ink)}
.ftabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.dl{margin:0;display:grid;gap:12px}
.dl dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.dl dd{margin:0;color:#dbe3ec}
.clin{border-left:2px solid var(--accent);padding:2px 0 2px 12px;color:#dbe3ec;margin:0 0 14px}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rel button{border:1px solid var(--line2);background:none;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rel button:hover{border-color:var(--accent)}
.fact{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.btn{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
textarea.nota{width:100%;min-height:200px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);padding:12px;resize:vertical;outline:none;line-height:1.55}
textarea.nota:focus{border-color:var(--accent)}
.nstat{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--faint);margin-top:6px}
.intro h2{margin:2px 0 6px;font:600 22px/1.2 var(--f-ui)}
.intro p{color:#cfd8e3;margin:0 0 12px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.counts div{background:var(--panel2);border-radius:12px;padding:10px}
.counts b{display:block;font:500 22px var(--f-mono)}
.counts span{font-size:11.5px;color:var(--muted)}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:#cfd8e3}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.tips li span{color:var(--accent);font-family:var(--f-mono)}

/* Dock de vistas */
.dock{position:absolute;z-index:16;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:calc(100% - 28px);overflow-x:auto;padding:6px;border-radius:99px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{flex:none;height:36px;padding:0 13px;border-radius:99px;border:0;background:none;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dock button:hover{color:var(--ink);background:var(--panel2)}
.dock button.on{background:var(--accent);color:var(--accent-ink)}
.dock .sep{width:1px;background:var(--line2);margin:6px 2px;flex:none}

/* Etiquetas y tooltip */
#labels{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:99px;background:rgba(7,11,18,.78);border:1px solid var(--line2);color:var(--ink);pointer-events:auto;cursor:pointer;transition:opacity .2s}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:8px;background:var(--line2)}
.lbl.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;font-size:13px;z-index:2}
.lbl.sel::after{background:var(--accent)}
#tip{position:absolute;z-index:30;pointer-events:none;background:rgba(7,11,18,.92);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:12.5px;transform:translate(14px,14px);white-space:nowrap}
#tip small{display:block;color:var(--muted);font-size:11px}

/* Modales y hojas */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.mcard{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:22px;padding:22px;box-shadow:0 40px 80px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
.mcard.wide{width:min(640px,100%)}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.mcard h3{margin:0 0 4px;font:600 20px var(--f-ui)}
.mcard .sub2{color:var(--muted);margin:0 0 14px;font-size:13px}
.mhead{display:flex;align-items:flex-start;gap:10px}
.mhead .x{margin-left:auto}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--panel2);cursor:pointer;font-size:18px;color:var(--muted);flex:none}
label.f{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:12px 0 5px}
input.in{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;outline:none;font-size:15px}
input.in:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row .grow{flex:1}
.note{background:rgba(95,211,228,.08);border:1px solid rgba(95,211,228,.2);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#cfe9ee;margin-top:14px}
.note.bad{background:rgba(255,139,122,.08);border-color:rgba(255,139,122,.3);color:#ffd2ca}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
.login-hero{display:grid;place-items:center;margin:-4px 0 14px}
.login-hero .mark{width:56px;height:56px;border-radius:17px}
.login-hero .mark svg{width:30px;height:30px}
.reglist{display:grid;gap:6px}
.reglist button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.reglist button.on{border-color:var(--accent)}
.reglist button[disabled]{opacity:.55;cursor:default}
.reglist small{color:var(--muted)}
.nlist{display:grid;gap:6px;margin-top:8px}
.nlist button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.nlist button:hover{border-color:var(--accent)}
.nlist b{font-weight:500;display:block}
.nlist small{color:var(--muted);display:block;font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nlist time{font:400 11px var(--f-mono);color:var(--faint);white-space:nowrap}

/* Estudio */
#study{position:absolute;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(0,0,0,.6);animation:pop .3s both}
#study .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
#study h4{margin:6px 0 12px;font:600 17px var(--f-ui)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line2);background:var(--bg2);border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font-weight:500}
.opts button:hover:not([disabled]){border-color:var(--accent)}
.opts button.ok{border-color:var(--ok);background:rgba(111,214,160,.12)}
.opts button.bad{border-color:var(--bad);background:rgba(255,139,122,.1)}
.opts button[disabled]{cursor:default}
.sfoot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;align-items:center}

#toast{position:fixed;z-index:80;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;font-size:13px;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.mnav{display:none}


/* Guardado en la nube */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:0 6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync.pend i{background:var(--nerve);animation:tp 1.1s infinite}
.sync.off i,.sync.err i{background:var(--bad)}
/* Mis estudios */
#esTabs{margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpis div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpis b{display:block;font:500 22px var(--f-mono)}
.kpis span{font-size:11.5px;color:var(--muted);line-height:1.25;display:block}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;height:120px;align-items:end;padding:6px 0 0}
.dbar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.dbar i{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--accent) 55%,transparent);display:block}
.dbar.hoy i{background:var(--accent)}
.dbar span{font:400 10px var(--f-mono);color:var(--faint)}
.tot{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12.5px}
.tot b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.pglist{display:grid;gap:10px}
.pgc{display:grid;grid-template-columns:110px 1fr;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;align-items:center}
.pgc img{width:110px;height:90px;object-fit:cover;border-radius:8px;background:#fff}
.pgi{min-width:0}
.pgi b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgi small{display:block;color:var(--muted);font-size:12px;margin:2px 0 8px}
.pga{display:flex;gap:6px;flex-wrap:wrap}
.pga .btn{height:32px;padding:0 11px;font-size:12.5px}
.empty2{text-align:center;padding:14px 6px}
.empty2 p{margin:0 0 6px}
details.cpass{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.cpass summary{cursor:pointer;font-weight:500}
/* Asistente */
#ai{right:max(14px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:84px;width:390px;z-index:17;display:none}
#ai.open{display:flex}
.aihead{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line);flex:none}
.aihead .x{width:32px;height:32px;display:grid;place-items:center}
.aihead .x .ic{width:16px;height:16px}
.aimark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(95,211,228,.25),rgba(242,201,76,.18));color:var(--accent);flex:none}
.aiti{flex:1;min-width:0}
.aiti b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.aiti small{font-size:11.5px;color:var(--faint)}
.aiti small.on{color:var(--ok)}
.aictx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
.aimsgs{flex:1;overflow:auto;padding:14px;min-height:0;display:flex;flex-direction:column;gap:12px}
.aiwel h4{margin:2px 0 6px;font:600 17px var(--f-ui)}
.aiwel p{margin:0 0 8px;color:#cfd8e3}
.aiwel p.ok{color:var(--ok);font-size:13px}
.msg{display:flex;flex-direction:column;max-width:100%}
.msg.u{align-items:flex-end}
.msg .bub{border-radius:16px;padding:10px 13px;line-height:1.55;overflow-wrap:anywhere}
.msg.u .bub{background:color-mix(in srgb,var(--accent) 22%,var(--panel2));border-bottom-right-radius:5px;max-width:88%}
.msg.a .bub{background:var(--panel2);border-bottom-left-radius:5px;color:#dbe3ec}
.msg.warn .bub{border:1px solid rgba(255,139,122,.35)}
.msg .bub p{margin:0 0 8px}.msg .bub p:last-child{margin-bottom:0}
.msg .bub ul,.msg .bub ol{margin:4px 0 8px;padding-left:20px}
.msg .bub li{margin:3px 0}
.msg .bub h5{margin:10px 0 4px;font:600 13.5px var(--f-ui);color:var(--ink)}
.msg .bub b{color:var(--ink);font-weight:600}
.msg .bub code{font-family:var(--f-mono);font-size:12px;background:var(--bg2);padding:1px 5px;border-radius:5px}
.msg .att{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.ref{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--bg2);border-radius:99px;padding:1px 8px 1px 6px;font-size:12.5px;cursor:pointer;vertical-align:1px;color:var(--ink);line-height:1.5}
.ref:hover{border-color:var(--accent)}
.ref .dot{width:7px;height:7px}
.mact{display:flex;align-items:center;gap:4px;margin-top:4px;padding-left:4px}
.mact .src{font:500 10.5px var(--f-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.mact button{border:0;background:none;color:var(--muted);font-size:11.5px;padding:3px 7px;border-radius:7px;cursor:pointer}
.mact button:hover{background:var(--panel2);color:var(--ink)}
.typing{display:inline-flex;gap:4px;align-items:center;height:18px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.aisug{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex:none;scrollbar-width:none}
.aisug::-webkit-scrollbar{display:none}
.aisug button{flex:none;border:1px solid var(--line2);background:none;border-radius:99px;padding:6px 11px;font-size:12px;color:#cfd8e3;cursor:pointer;white-space:nowrap}
.aisug button:hover{border-color:var(--accent);color:var(--ink)}
.aiform{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);flex:none}
.aiform textarea{flex:1;min-width:0;resize:none;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);padding:10px 12px;outline:none;max-height:140px;line-height:1.4;font-size:14.5px}
.aiform textarea:focus{border-color:var(--accent)}
.aicam,.aisend{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--muted)}
.aicam.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.aisend{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ai{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.steps{margin:10px 0 6px;padding-left:20px;color:#cfd8e3;font-size:13px}
.steps li{margin:4px 0}
.steps a,.mcard a{color:var(--accent)}
.keyrow{display:flex;gap:6px}
.keyrow .in{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px}
.keyrow .btn{height:44px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#cfd8e3;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* Imprimir */
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{border:1px solid var(--line2);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:#cfd8e3}
.pchips button.on{background:color-mix(in srgb,var(--accent) 20%,var(--bg));border-color:var(--accent);color:var(--ink)}
.pchips button[disabled]{opacity:.4;cursor:default}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
#prev{position:fixed;inset:0;z-index:90;background:#2a2f37;overflow:auto;-webkit-overflow-scrolling:touch}
.prevbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.prevbar b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.prevbar .grow{flex:1}
#print{--pw:816px;padding:18px 0 40px}
.pwait{color:#cfd8e3;display:flex;gap:10px;align-items:center;justify-content:center;padding:60px 0}
.pp{width:var(--pw);margin:0 auto 22px;background:#fff;color:#151a21;padding:42px;box-shadow:0 10px 40px rgba(0,0,0,.4);font:10pt/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif;color-scheme:light}
.phd{display:flex;justify-content:space-between;gap:10px;font-size:8.5pt;color:#5b6573;border-bottom:1px solid #d8dde4;padding-bottom:6px;margin-bottom:12px}
.pp h1{font:600 20pt/1.15 "IBM Plex Sans",Arial,sans-serif;margin:0 0 2px;letter-spacing:-.01em}
.pmeta{margin:0 0 10px;color:#5b6573;font-size:9pt}
.pv{font:600 13pt "IBM Plex Sans",Arial,sans-serif;margin:0 0 8px}
.pimg{display:block;width:100%;height:auto;max-height:178mm;object-fit:contain;border-radius:4px}
.pp.land .pimg{max-height:128mm}
.pp h1 + .pmeta + .pbodyp .pimg{max-height:148mm}
.pp.land h1 + .pmeta + .pbodyp .pimg{max-height:118mm}
.pbodyp.split{display:grid;grid-template-columns:1fr 62mm;gap:12px;align-items:start}
.pleg{list-style:none;margin:8px 0 0;padding:0;columns:3;column-gap:14px;font-size:8pt;line-height:1.3}
.pbodyp.split .pleg{columns:1;margin:0}
.pleg li{display:flex;align-items:center;gap:5px;break-inside:avoid;padding:1px 0}
.pleg li b{font:600 8.6pt "IBM Plex Mono",monospace;min-width:20px;text-align:right;color:#2a3340}
.pleg .blank{flex:1;border-bottom:1px solid #9aa3ae;height:12px;margin-right:6px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.pft{margin-top:10px;font-size:7.5pt;color:#7b8592;border-top:1px solid #e6e9ee;padding-top:5px}
.pcols{columns:2;column-gap:18px}
.pp.land .pcols{columns:3}
.pf{break-inside:avoid;border:1px solid #dde2e8;border-radius:8px;padding:9px 11px;margin:0 0 10px;display:inline-block;width:100%}
.pf h4{margin:0;font:600 11pt "IBM Plex Sans",Arial,sans-serif;display:flex;align-items:center;gap:6px}
.pf .pl{margin:1px 0 6px;font:italic 9pt "Newsreader",Georgia,serif;color:#5b6573}
.pf dl{margin:0;font-size:8.6pt}
.pf dt{font-size:7pt;letter-spacing:.08em;text-transform:uppercase;color:#7b8592;margin-top:4px}
.pf dd{margin:0}
.pn{margin-top:6px;background:#f2f7f9;border-left:2px solid #2aa7b8;padding:5px 8px;font-size:8.6pt}
.pn b{display:block;font-size:7pt;letter-spacing:.08em;text-transform:uppercase;color:#2a7f8c}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app,#modal,#toast,.prevbar{display:none!important}
  #prev{position:static!important;background:#fff!important;overflow:visible!important;display:block!important}
  #print{zoom:1!important;padding:0!important}
  .pp{width:auto!important;margin:0!important;padding:0!important;box-shadow:none!important;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp:last-child{break-after:auto;page-break-after:auto}
}

/* ===== Celular ===== */
@media (max-width:860px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .brand{flex:1}
  .search{order:3;flex:1 1 100%;max-width:none}
  .ib .t{display:none}
  .panel{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;max-height:64vh;height:64vh;border-radius:22px 22px 0 0;border-bottom:0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:40}
  .panel.open{transform:none}
  .panel .close{display:block;position:absolute;right:10px;top:8px;z-index:2}
  .panel .tabs{padding-right:52px}
  .dock{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .mnav{display:flex;position:fixed;z-index:45;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .mnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--muted);cursor:pointer}
  .mnav button.on{color:var(--accent)}
  #study{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .ib.dsk{display:none}
  .sync span{display:none}
  .sync{padding:0 2px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgc{grid-template-columns:84px 1fr}
  .pgc img{width:84px;height:72px}
  #ai{display:flex;height:82vh;max-height:82vh}
  #ai .aihead{padding-right:12px}
  .pp{padding:30px}
  .prevbar .btn{height:34px;padding:0 11px;font-size:12.5px}
  .opts{grid-template-columns:1fr 1fr}
  .opts button{padding:9px 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <canvas id="gl" aria-label="Modelo anatómico 3D: arrastra para girar, pellizca o usa la rueda para acercar, toca una estructura para ver su ficha"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="tip" hidden></div>

  <header class="bar">
    <div class="brand">
      <span class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c-2 0-3 1.5-3 3s1 3 3 3 3-1.5 3-3-1-3-3-3z"/><path d="M8 21l1-7-3-3 3-2h6l3 2-3 3 1 7"/></svg></span>
      <div><b>Atlas Anatómico</b><button class="reg" id="btnReg" type="button"><span id="regName">Hombro y brazo</span><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M6 9l6 6 6-6"/></svg></button></div>

      <button class="ib dsk" id="btnStudy" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg><span class="t">Estudiar</span></button>
      <button class="ib" id="btnPrint" type="button" aria-label="Imprimir"><svg class="ic" viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span class="t">Imprimir</span></button>
      <button class="ib" id="btnNotes" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg><span class="t">Mis estudios</span></button>
      <button class="av guest" id="btnUser" type="button" aria-label="Mi cuenta">?</button>
    </div>
  </header>

  <aside class="panel" id="left" aria-label="Capas y explorador">
    <button class="x close" type="button" data-close="left" aria-label="Cerrar">×</button>

    <div class="pbody" id="leftBody"></div>
  </aside>

  <aside class="panel" id="ai" aria-label="Asistente de anatomía">
    <div class="aihead"><span class="aimark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg></span><div class="aiti"><b>Asistente de anatomía</b><small id="aiState">Modo atlas · sin IA</small></div>
      <button class="x" type="button" id="aiCfg" aria-label="Configurar la IA" title="Configurar la IA"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="x" type="button" id="aiClear" aria-label="Borrar conversación" title="Borrar conversación"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>

    <div class="aictx" id="aiCtx"></div>

      <textarea id="aiIn" rows="1" placeholder="Pregunta sobre cualquier parte del cuerpo…" aria-label="Escribe tu pregunta"></textarea><button class="aisend" id="aiSend" type="submit" aria-label="Enviar"></button></form>
  </aside>

  <div class="dock" id="dock">
    <button type="button" data-view="ant">Anterior</button><button type="button" data-view="post">Posterior</button><button type="button" data-view="lat">Lateral</button><button type="button" data-view="sup">Superior</button><button type="button" data-view="reset">Inicio</button>

  </nav>

  <div id="study" hidden></div>
