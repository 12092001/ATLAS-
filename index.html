trapecio:{cat:"musculo", capa:"Superficial", grupo:"Toracoapendiculares posteriores", nombre:"Trapecio", latin:"Musculus trapezius",
  resumen:"Músculo plano y triangular que cubre la nuca y la parte alta de la espalda. Mueve y sostiene la escápula en tres direcciones según sus fibras.",
  origen:"Tercio medial de la línea nucal superior, protuberancia occipital externa, ligamento nucal y apófisis espinosas de C7 a T12.",
  insercion:"Tercio lateral de la clavícula, acromion y espina de la escápula.",
  inervacion:"Nervio accesorio (NC XI), motor; ramos de C3–C4, propioceptivos.",
  irrigacion:"Arteria cervical transversa; también occipital y dorsal de la escápula.",
  accion:"Fibras superiores: elevan la escápula y la rotan hacia arriba. Medias: la retraen. Inferiores: la deprimen y ayudan a rotarla hacia arriba. Juntas mantienen el hombro alineado.",
  clinica:"La lesión del nervio accesorio (por ejemplo en cirugía de ganglios del cuello) causa hombro caído, escápula ligeramente alada y dificultad para levantar el brazo por encima de 90°.",
  prueba:"Pedir que encoja los hombros contra resistencia (fibras superiores)."},
deltoides:{cat:"musculo", capa:"Superficial", grupo:"Escapulohumerales", nombre:"Deltoides", latin:"Musculus deltoideus",
  resumen:"Da el contorno redondeado al hombro. Tiene tres porciones: clavicular (anterior), acromial (media) y espinal (posterior).",
  origen:"Tercio lateral de la clavícula, acromion y espina de la escápula.",
  insercion:"Tuberosidad deltoidea del húmero.",
  inervacion:"Nervio axilar (C5–C6).",
  irrigacion:"Arteria circunfleja humeral posterior y rama deltoidea de la arteria toracoacromial.",
  accion:"Porción acromial: abducción del brazo de 15° a 90°. Porción clavicular: flexión y rotación medial. Porción espinal: extensión y rotación lateral.",
  clinica:"La fractura del cuello quirúrgico del húmero o la luxación anterior del hombro pueden lesionar el nervio axilar: se pierde la abducción y aparece una zona sin sensibilidad sobre el deltoides («parche de sargento»). Es un sitio frecuente de inyección intramuscular, unos 5 cm bajo el acromion.",
  prueba:"Abducción del brazo contra resistencia a 45–90°."},
pectoral_mayor:{cat:"musculo", capa:"Superficial", grupo:"Toracoapendiculares anteriores", nombre:"Pectoral mayor", latin:"Musculus pectoralis major",
  resumen:"Músculo grande en abanico que forma el pecho y el pliegue anterior de la axila. Tiene porción clavicular y porción esternocostal.",
  origen:"Porción clavicular: mitad medial de la cara anterior de la clavícula. Porción esternocostal: cara anterior del esternón, cartílagos costales 1 a 6 y aponeurosis del oblicuo externo.",
  insercion:"Labio lateral del surco intertubercular del húmero.",
  inervacion:"Nervios pectorales lateral y medial; porción clavicular C5–C6, esternocostal C7–C8–T1.",
  irrigacion:"Rama pectoral de la arteria toracoacromial y arterias torácicas.",
  accion:"Aducción y rotación medial del brazo. La porción clavicular flexiona el brazo; la esternocostal lo extiende desde la flexión. Ayuda en la inspiración forzada si el brazo está fijo.",
  clinica:"Su ausencia congénita parcial es el síndrome de Poland. Al insertarse, sus fibras se tuercen: las inferiores llegan más arriba que las superiores, lo que forma el pliegue axilar anterior.",
  prueba:"Juntar las manos frente al pecho y presionar (aducción)."},
dorsal_ancho:{cat:"musculo", capa:"Superficial", grupo:"Toracoapendiculares posteriores", nombre:"Dorsal ancho", latin:"Musculus latissimus dorsi",
  resumen:"El músculo más ancho de la espalda. Une el tronco con el brazo y forma el pliegue posterior de la axila.",
  origen:"Apófisis espinosas de T7 a T12, fascia toracolumbar, cresta ilíaca, últimas 3–4 costillas y, a menudo, el ángulo inferior de la escápula.",
  insercion:"Suelo del surco intertubercular del húmero.",
  inervacion:"Nervio toracodorsal (C6–C8).",
  irrigacion:"Arteria toracodorsal y ramas perforantes intercostales y lumbares.",
  accion:"Extensión, aducción y rotación medial del brazo. Eleva el cuerpo hacia los brazos al trepar y es clave en la natación.",
  clinica:"Se usa con frecuencia como colgajo para reconstrucción mamaria. Su nervio puede lesionarse en la cirugía de la axila.",
  prueba:"Tos con la mano en el borde de la axila posterior: se palpa su contracción."},
serrato_anterior:{cat:"musculo", capa:"Superficial", grupo:"Toracoapendiculares anteriores", nombre:"Serrato anterior", latin:"Musculus serratus anterior",
  resumen:"Músculo en forma de sierra en la pared lateral del tórax. Pega la escápula a las costillas y la lleva hacia delante.",
  origen:"Caras externas de las costillas 1 a 8 o 9, mediante digitaciones.",
  insercion:"Cara costal (anterior) del borde medial de la escápula, sobre todo en el ángulo inferior.",
  inervacion:"Nervio torácico largo (C5–C7).",
  irrigacion:"Arterias torácica lateral y toracodorsal.",
  accion:"Protrae la escápula (el «músculo del boxeador») y la rota hacia arriba, indispensable para levantar el brazo por encima de la cabeza. Mantiene la escápula contra el tórax.",
  clinica:"La lesión del nervio torácico largo (cirugía de axila, mochilas pesadas, golpes) produce escápula alada: el borde medial se despega al empujar una pared.",
  prueba:"Empujar una pared con los brazos extendidos y observar la escápula."},
biceps_braquial:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior del brazo", nombre:"Bíceps braquial", latin:"Musculus biceps brachii",
  resumen:"Músculo de dos cabezas en la cara anterior del brazo. Cruza dos articulaciones: hombro y codo.",
  origen:"Cabeza corta: punta de la apófisis coracoides. Cabeza larga: tubérculo supraglenoideo de la escápula, dentro de la articulación; su tendón baja por el surco intertubercular.",
  insercion:"Tuberosidad del radio y, mediante la aponeurosis bicipital, la fascia del antebrazo.",
  inervacion:"Nervio musculocutáneo (C5–C6).",
  irrigacion:"Ramas musculares de la arteria braquial.",
  accion:"Supinador potente del antebrazo y flexor del codo, sobre todo con el antebrazo supinado. Flexiona débilmente el hombro.",
  clinica:"La rotura del tendón de la cabeza larga hace que el vientre muscular se abulte hacia abajo («signo de Popeye»). El reflejo bicipital explora C5–C6.",
  prueba:"Flexionar el codo con la palma hacia arriba contra resistencia."},
triceps_braquial:{cat:"musculo", capa:"Superficial", grupo:"Compartimento posterior del brazo", nombre:"Tríceps braquial", latin:"Musculus triceps brachii",
  resumen:"Ocupa toda la parte posterior del brazo, con tres cabezas: larga, lateral y medial.",
  origen:"Cabeza larga: tubérculo infraglenoideo de la escápula. Cabeza lateral: cara posterior del húmero, por encima del surco del nervio radial. Cabeza medial: cara posterior del húmero, por debajo del surco del nervio radial.",
  insercion:"Cara superior del olécranon del cúbito y fascia del antebrazo.",
  inervacion:"Nervio radial (C6–C8).",
  irrigacion:"Arteria braquial profunda.",
  accion:"Principal extensor del codo. La cabeza larga además extiende y aduce el brazo y estabiliza la cabeza del húmero en aducción.",
  clinica:"El reflejo tricipital explora sobre todo C7. En fracturas de la diáfisis del húmero, el nervio radial queda en riesgo entre las cabezas lateral y medial.",
  prueba:"Extender el codo desde la flexión contra resistencia."},
anconeo:{cat:"musculo", capa:"Superficial", grupo:"Compartimento posterior del antebrazo", nombre:"Ancóneo", latin:"Musculus anconeus",
  resumen:"Músculo pequeño y triangular en la cara posterior del codo, continuación del tríceps.",
  origen:"Cara posterior del epicóndilo lateral del húmero.",
  insercion:"Cara lateral del olécranon y parte proximal de la cara posterior del cúbito.",
  inervacion:"Nervio radial (C7–C8).",
  irrigacion:"Arteria interósea recurrente y colateral media.",
  accion:"Ayuda al tríceps a extender el codo, tensa la cápsula y estabiliza el codo durante la pronación.",
  clinica:"Se usa como referencia en abordajes quirúrgicos posterolaterales del codo.",
  prueba:"Se palpa lateral al olécranon al extender el codo."},
braquiorradial:{cat:"musculo", capa:"Superficial", grupo:"Compartimento posterior del antebrazo (grupo lateral)", nombre:"Braquiorradial", latin:"Musculus brachioradialis",
  resumen:"Forma el borde lateral carnoso del antebrazo. Aunque está en el compartimento posterior, flexiona el codo.",
  origen:"Dos tercios proximales de la cresta supracondílea lateral del húmero.",
  insercion:"Cara lateral del extremo distal del radio, proximal a la apófisis estiloides.",
  inervacion:"Nervio radial (C5–C6).",
  irrigacion:"Arteria recurrente radial.",
  accion:"Flexiona el codo, con más fuerza cuando el antebrazo está en posición neutra (pulgar hacia arriba, como al sostener un vaso).",
  clinica:"Su reflejo explora C6. Es el límite lateral de la fosa del codo.",
  prueba:"Flexionar el codo con el pulgar hacia arriba contra resistencia."},
pronador_redondo:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior del antebrazo", nombre:"Pronador redondo", latin:"Musculus pronator teres",
  resumen:"Músculo oblicuo de la parte proximal del antebrazo que gira la palma hacia abajo. Forma el límite medial de la fosa del codo.",
  origen:"Cabeza humeral: epicóndilo medial del húmero. Cabeza cubital: apófisis coronoides del cúbito.",
  insercion:"Parte media de la cara lateral del radio.",
  inervacion:"Nervio mediano (C6–C7).",
  irrigacion:"Arterias cubital y recurrente cubital anterior.",
  accion:"Prona el antebrazo y ayuda a flexionar el codo.",
  clinica:"El nervio mediano pasa entre sus dos cabezas; ahí puede comprimirse (síndrome del pronador).",
  prueba:"Pronar el antebrazo contra resistencia con el codo extendido."},
/* ---------------- MÚSCULOS PROFUNDOS ---------------- */
supraespinoso:{cat:"musculo", capa:"Profundo", grupo:"Manguito rotador", nombre:"Supraespinoso", latin:"Musculus supraspinatus",
  resumen:"Músculo del manguito rotador que ocupa la fosa supraespinosa y pasa bajo el acromion hasta el húmero.",
  origen:"Dos tercios mediales de la fosa supraespinosa de la escápula.",
  insercion:"Carilla superior del tubérculo mayor del húmero.",
  inervacion:"Nervio supraescapular (C5–C6).",
  irrigacion:"Arteria supraescapular.",
  accion:"Inicia la abducción del brazo (primeros 15°) y mantiene la cabeza del húmero centrada en la cavidad glenoidea.",
  clinica:"Es el tendón del manguito que más se lesiona: se pinza entre el acromion y el húmero (síndrome subacromial) y puede romperse con la edad o por sobreuso.",
  prueba:"Prueba de Jobe («lata vacía»): brazos a 90° en el plano de la escápula, pulgares hacia abajo, empujar hacia arriba contra resistencia."},
infraespinoso:{cat:"musculo", capa:"Profundo", grupo:"Manguito rotador", nombre:"Infraespinoso", latin:"Musculus infraspinatus",
  resumen:"Músculo grueso del manguito rotador que llena la fosa infraespinosa.",
  origen:"Fosa infraespinosa de la escápula.",
  insercion:"Carilla media del tubérculo mayor del húmero.",
  inervacion:"Nervio supraescapular (C5–C6).",
  irrigacion:"Arterias supraescapular y circunfleja escapular.",
  accion:"Rotación lateral del brazo y estabilización de la cabeza del húmero.",
  clinica:"Su atrofia aislada sugiere compresión del nervio supraescapular en la escotadura espinoglenoidea (frecuente en voleibolistas).",
  prueba:"Rotación externa contra resistencia con el codo pegado al cuerpo y flexionado a 90°."},
redondo_menor:{cat:"musculo", capa:"Profundo", grupo:"Manguito rotador", nombre:"Redondo menor", latin:"Musculus teres minor",
  resumen:"El músculo más pequeño del manguito rotador, justo debajo del infraespinoso.",
  origen:"Dos tercios superiores del borde lateral de la escápula.",
  insercion:"Carilla inferior del tubérculo mayor del húmero.",
  inervacion:"Nervio axilar (C5–C6).",
  irrigacion:"Arteria circunfleja escapular.",
  accion:"Rotación lateral del brazo y ayuda a mantener la cabeza del húmero en la cavidad glenoidea.",
  clinica:"Forma el límite superior de los espacios cuadrangular y triangular, por donde pasan el nervio axilar y vasos importantes.",
  prueba:"Signo de Hornblower: el paciente no puede llevarse la mano a la boca sin levantar el codo."},
subescapular:{cat:"musculo", capa:"Profundo", grupo:"Manguito rotador", nombre:"Subescapular", latin:"Musculus subscapularis",
  resumen:"El músculo más grande y fuerte del manguito rotador. Ocupa la cara anterior de la escápula, entre ella y las costillas.",
  origen:"Fosa subescapular (cara costal de la escápula).",
  insercion:"Tubérculo menor del húmero.",
  inervacion:"Nervios subescapulares superior e inferior (C5–C6, a veces C7).",
  irrigacion:"Arteria subescapular.",
  accion:"Rotación medial del brazo. Es la principal barrera anterior contra la luxación del hombro.",
  clinica:"Su rotura suele acompañar a las luxaciones anteriores en personas mayores.",
  prueba:"Prueba de Gerber (lift-off): mano en la espalda baja, separarla del cuerpo. Prueba de presión abdominal (belly-press)."},
redondo_mayor:{cat:"musculo", capa:"Profundo", grupo:"Escapulohumerales", nombre:"Redondo mayor", latin:"Musculus teres major",
  resumen:"Músculo grueso que va del ángulo inferior de la escápula al húmero. Trabaja junto al dorsal ancho («su pequeño ayudante»).",
  origen:"Cara posterior del ángulo inferior de la escápula.",
  insercion:"Labio medial del surco intertubercular del húmero.",
  inervacion:"Nervio subescapular inferior (C5–C6).",
  irrigacion:"Arterias toracodorsal y circunfleja escapular.",
  accion:"Aducción, extensión y rotación medial del brazo.",
  clinica:"Su borde inferior marca el punto donde la arteria axilar pasa a llamarse arteria braquial.",
  prueba:"Aducción del brazo contra resistencia con la mano en la cadera."},
romboide_mayor:{cat:"musculo", capa:"Profundo", grupo:"Toracoapendiculares posteriores", nombre:"Romboide mayor", latin:"Musculus rhomboideus major",
  resumen:"Músculo en forma de rombo, bajo el trapecio, que une la columna con el borde medial de la escápula.",
  origen:"Apófisis espinosas de T2 a T5.",
  insercion:"Borde medial de la escápula, desde la raíz de la espina hasta el ángulo inferior.",
  inervacion:"Nervio dorsal de la escápula (C4–C5).",
  irrigacion:"Arteria dorsal de la escápula.",
  accion:"Retrae la escápula, la rota hacia abajo y la fija contra el tórax.",
  clinica:"Su debilidad hace que el borde medial de la escápula se separe ligeramente de las costillas.",
  prueba:"Manos en la cadera, llevar los codos hacia atrás contra resistencia y palpar entre las escápulas."},
romboide_menor:{cat:"musculo", capa:"Profundo", grupo:"Toracoapendiculares posteriores", nombre:"Romboide menor", latin:"Musculus rhomboideus minor",
  resumen:"Pequeña banda muscular justo por encima del romboide mayor.",
  origen:"Ligamento nucal y apófisis espinosas de C7 y T1.",
  insercion:"Borde medial de la escápula, a la altura de la raíz de la espina.",
  inervacion:"Nervio dorsal de la escápula (C4–C5).",
  irrigacion:"Arteria dorsal de la escápula.",
  accion:"Retrae y rota hacia abajo la escápula, junto con el romboide mayor.",
  clinica:"Con frecuencia se fusiona con el romboide mayor y es difícil separarlos en la disección.",
  prueba:"Igual que el romboide mayor."},
elevador_escapula:{cat:"musculo", capa:"Profundo", grupo:"Toracoapendiculares posteriores", nombre:"Elevador de la escápula", latin:"Musculus levator scapulae",
  resumen:"Músculo alargado en la parte lateral y posterior del cuello que sube la escápula.",
  origen:"Tubérculos posteriores de las apófisis transversas de C1 a C4.",
  insercion:"Borde medial de la escápula, desde el ángulo superior hasta la raíz de la espina.",
  inervacion:"Nervio dorsal de la escápula (C5) y ramos cervicales C3–C4.",
  irrigacion:"Arterias cervical transversa y cervical ascendente.",
  accion:"Eleva la escápula y la rota hacia abajo; con la escápula fija, inclina el cuello hacia su lado.",
  clinica:"Es una fuente muy común de dolor y contractura en el cuello y la parte alta de la espalda por malas posturas.",
  prueba:"Elevar el hombro contra resistencia con el cuello inclinado hacia el mismo lado."},
pectoral_menor:{cat:"musculo", capa:"Profundo", grupo:"Toracoapendiculares anteriores", nombre:"Pectoral menor", latin:"Musculus pectoralis minor",
  resumen:"Músculo triangular bajo el pectoral mayor. Es la referencia para dividir la arteria axilar en tres partes.",
  origen:"Costillas 3 a 5, cerca de sus cartílagos costales.",
  insercion:"Borde medial y cara superior de la apófisis coracoides.",
  inervacion:"Nervio pectoral medial (C8–T1).",
  irrigacion:"Rama pectoral de la arteria toracoacromial.",
  accion:"Estabiliza la escápula tirando de ella hacia delante y abajo contra el tórax. Ayuda a elevar las costillas en la inspiración forzada.",
  clinica:"Cuando está acortado lleva los hombros hacia delante y puede comprimir el paquete vasculonervioso axilar.",
  prueba:"Se palpa bajo el pectoral mayor al empujar el hombro hacia delante."},
subclavio:{cat:"musculo", capa:"Profundo", grupo:"Toracoapendiculares anteriores", nombre:"Subclavio", latin:"Musculus subclavius",
  resumen:"Músculo pequeño y cilíndrico bajo la clavícula.",
  origen:"Unión de la primera costilla con su cartílago costal.",
  insercion:"Cara inferior del tercio medio de la clavícula.",
  inervacion:"Nervio del subclavio (C5–C6).",
  irrigacion:"Rama clavicular de la arteria toracoacromial.",
  accion:"Ancla y deprime la clavícula, estabilizando la articulación esternoclavicular.",
  clinica:"En las fracturas de clavícula amortigua y protege los vasos subclavios que pasan debajo.",
  prueba:"No se explora de forma aislada."},
coracobraquial:{cat:"musculo", capa:"Profundo", grupo:"Compartimento anterior del brazo", nombre:"Coracobraquial", latin:"Musculus coracobrachialis",
  resumen:"Músculo alargado en la parte superior y medial del brazo. El nervio musculocutáneo lo atraviesa.",
  origen:"Punta de la apófisis coracoides de la escápula.",
  insercion:"Tercio medio de la cara medial del húmero.",
  inervacion:"Nervio musculocutáneo (C5–C7).",
  irrigacion:"Ramas musculares de la arteria braquial.",
  accion:"Flexiona y aduce el brazo; ayuda a mantener la cabeza del húmero en su lugar.",
  clinica:"Referencia para localizar el nervio musculocutáneo, que entra en el músculo unos 5 cm bajo la coracoides.",
  prueba:"Flexión y aducción del brazo contra resistencia."},
braquial:{cat:"musculo", capa:"Profundo", grupo:"Compartimento anterior del brazo", nombre:"Braquial", latin:"Musculus brachialis",
  resumen:"Músculo ancho y aplanado, bajo el bíceps. Es el flexor más importante del codo.",
  origen:"Mitad distal de la cara anterior del húmero.",
  insercion:"Apófisis coronoides y tuberosidad del cúbito.",
  inervacion:"Nervio musculocutáneo (C5–C6) y una pequeña rama del nervio radial (C7) en su parte lateral.",
  irrigacion:"Arterias braquial y recurrente radial.",
  accion:"Flexiona el codo en cualquier posición del antebrazo; por eso se le llama «el caballo de batalla» de la flexión.",
  clinica:"Tras traumatismos del codo puede osificarse (miositis osificante).",
  prueba:"Flexión del codo con el antebrazo en pronación (el bíceps trabaja menos)."},
supinador:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior del antebrazo (profundo)", nombre:"Supinador", latin:"Musculus supinator",
  resumen:"Lámina muscular que envuelve el tercio proximal del radio. La rama profunda del nervio radial lo atraviesa.",
  origen:"Epicóndilo lateral del húmero, ligamentos colateral radial y anular, y cresta del supinador del cúbito.",
  insercion:"Caras lateral, posterior y anterior del tercio proximal del radio.",
  inervacion:"Ramo profundo del nervio radial (C6–C7).",
  irrigacion:"Arterias recurrente radial e interósea recurrente.",
  accion:"Supina el antebrazo, sobre todo con el codo extendido o en movimientos lentos.",
  clinica:"En la arcada de Fröhse (borde proximal del músculo) puede comprimirse el nervio interóseo posterior: debilidad para extender los dedos sin pérdida de sensibilidad.",
  prueba:"Supinación con el codo extendido contra resistencia."},
/* ---------------- LIGAMENTOS Y ARTICULACIÓN ---------------- */
lig_esternoclaviculares:{cat:"ligamento", grupo:"Articulación esternoclavicular", nombre:"Ligamentos esternoclaviculares", latin:"Ligamenta sternoclavicularia anterius et posterius",
  resumen:"Bandas anterior y posterior que refuerzan la cápsula de la única articulación que une el brazo con el tronco.",
  une:"Extremo esternal de la clavícula con el manubrio del esternón.", funcion:"Limitan el desplazamiento anterior y posterior de la clavícula.",
  clinica:"La luxación esternoclavicular posterior es rara pero peligrosa: puede comprimir la tráquea o los grandes vasos."},
lig_costoclavicular:{cat:"ligamento", grupo:"Articulación esternoclavicular", nombre:"Ligamento costoclavicular", latin:"Ligamentum costoclaviculare",
  resumen:"Ligamento corto y fuerte, el principal estabilizador de la articulación esternoclavicular.",
  une:"Primera costilla y su cartílago con la impresión costoclavicular de la cara inferior de la clavícula.", funcion:"Limita la elevación de la clavícula y actúa como pivote de sus movimientos.",
  clinica:"Su fuerza explica que la clavícula se fracture antes que luxarse en el esternón."},
lig_interclavicular:{cat:"ligamento", grupo:"Articulación esternoclavicular", nombre:"Ligamento interclavicular", latin:"Ligamentum interclaviculare",
  resumen:"Banda que cruza sobre la escotadura yugular uniendo las dos clavículas.",
  une:"Extremos esternales de ambas clavículas, pasando por el borde superior del manubrio.", funcion:"Refuerza la cápsula esternoclavicular por arriba y limita la depresión del hombro.",
  clinica:"Se tensa al bajar el hombro; se palpa justo sobre la escotadura yugular."},
lig_acromioclavicular:{cat:"ligamento", grupo:"Articulación acromioclavicular", nombre:"Ligamento acromioclavicular", latin:"Ligamentum acromioclaviculare",
  resumen:"Refuerza por arriba la pequeña articulación entre la clavícula y el acromion.",
  une:"Extremo acromial de la clavícula con el acromion.", funcion:"Controla la estabilidad horizontal (anteroposterior) de la articulación acromioclavicular.",
  clinica:"Se lesiona en las caídas sobre el hombro («separación del hombro»). Las lesiones se gradúan de I a VI según la clasificación de Rockwood."},
lig_conoide:{cat:"ligamento", grupo:"Ligamento coracoclavicular", nombre:"Ligamento conoide", latin:"Ligamentum conoideum",
  resumen:"Parte medial, en forma de cono invertido, del ligamento coracoclavicular.",
  une:"Base de la apófisis coracoides con el tubérculo conoideo de la clavícula.", funcion:"Junto con el trapezoide, da la estabilidad vertical al hombro: suspende la escápula de la clavícula.",
  clinica:"Su rotura, junto con el trapezoide, hace que la clavícula se vea elevada en las separaciones acromioclaviculares graves."},
lig_trapezoide:{cat:"ligamento", grupo:"Ligamento coracoclavicular", nombre:"Ligamento trapezoide", latin:"Ligamentum trapezoideum",
  resumen:"Parte lateral, cuadrilátera, del ligamento coracoclavicular.",
  une:"Cara superior de la apófisis coracoides con la línea trapezoidea de la clavícula.", funcion:"Estabilidad vertical de la articulación acromioclavicular y transmisión de fuerzas del brazo al tronco.",
  clinica:"Su reparación o reconstrucción es parte de la cirugía de las separaciones acromioclaviculares grados III a V."},
lig_coracoacromial:{cat:"ligamento", grupo:"Arco coracoacromial", nombre:"Ligamento coracoacromial", latin:"Ligamentum coracoacromiale",
  resumen:"Banda triangular que junto con el acromion y la coracoides forma un «techo» sobre la cabeza del húmero.",
  une:"Borde lateral de la apófisis coracoides con el vértice del acromion.", funcion:"Forma el arco coracoacromial, que impide que la cabeza del húmero se desplace hacia arriba.",
  clinica:"Puede engrosarse y contribuir al pinzamiento subacromial del supraespinoso; a veces se libera en la cirugía (acromioplastia)."},
lig_transverso_superior_escapula:{cat:"ligamento", grupo:"Escápula", nombre:"Ligamento transverso superior de la escápula", latin:"Ligamentum transversum scapulae superius",
  resumen:"Puente que convierte la escotadura supraescapular en un agujero.",
  une:"Los dos bordes de la escotadura supraescapular.", funcion:"Separa el nervio supraescapular, que pasa por debajo, de la arteria supraescapular, que pasa por encima.",
  clinica:"Regla mnemotécnica: «el ejército (arteria) pasa sobre el puente y la marina (nervio) por debajo». Puede calcificarse y comprimir el nervio."},
lig_coracohumeral:{cat:"ligamento", grupo:"Articulación del hombro", nombre:"Ligamento coracohumeral", latin:"Ligamentum coracohumerale",
  resumen:"Banda ancha que refuerza la parte superior de la cápsula del hombro.",
  une:"Base de la apófisis coracoides con los tubérculos mayor y menor del húmero.", funcion:"Sostiene la cabeza del húmero y limita la rotación lateral y el desplazamiento inferior.",
  clinica:"Se engrosa y retrae en la capsulitis adhesiva («hombro congelado»), que limita sobre todo la rotación externa."},
lig_glenohumerales:{cat:"ligamento", grupo:"Articulación del hombro", nombre:"Ligamentos glenohumerales", latin:"Ligamenta glenohumeralia (superius, medium, inferius)",
  resumen:"Tres engrosamientos de la cara anterior de la cápsula: superior, medio e inferior.",
  une:"Borde anterior de la cavidad glenoidea y rodete con el cuello anatómico del húmero.", funcion:"Frenan la traslación anterior de la cabeza del húmero. El inferior es el más importante con el brazo en abducción y rotación externa.",
  clinica:"Se lesionan en la luxación anterior del hombro, la más frecuente de todas las luxaciones grandes."},
rodete_glenoideo:{cat:"ligamento", grupo:"Articulación del hombro", nombre:"Rodete glenoideo (labrum)", latin:"Labrum glenoidale",
  resumen:"Anillo de fibrocartílago que bordea la cavidad glenoidea y la hace más profunda.",
  une:"Se fija al borde de la cavidad glenoidea; en su parte superior se continúa con el tendón de la cabeza larga del bíceps.", funcion:"Aumenta la superficie de contacto y la estabilidad de una articulación muy móvil pero poco encajada.",
  clinica:"Lesión de Bankart: desinserción anteroinferior tras luxación. Lesión SLAP: desgarro superior, típico de deportes de lanzamiento."},
capsula_hombro:{cat:"ligamento", grupo:"Articulación del hombro", nombre:"Cápsula articular del hombro", latin:"Capsula articularis glenohumeralis",
  resumen:"Manguito fibroso amplio y laxo que envuelve la articulación glenohumeral. Su laxitud permite la gran movilidad del hombro.",
  une:"Borde de la cavidad glenoidea con el cuello anatómico del húmero; por abajo forma un receso amplio (bolsa axilar).", funcion:"Encierra la membrana sinovial y el líquido articular; se refuerza con los ligamentos y los tendones del manguito rotador.",
  clinica:"Su parte inferior es la más débil: por eso la mayoría de las luxaciones son anteroinferiores."},
lig_transverso_humero:{cat:"ligamento", grupo:"Articulación del hombro", nombre:"Ligamento transverso del húmero", latin:"Ligamentum transversum humeri",
  resumen:"Pequeña banda que cubre el surco intertubercular.",
  une:"Tubérculo mayor con el tubérculo menor del húmero.", funcion:"Mantiene el tendón de la cabeza larga del bíceps dentro de su surco.",
  clinica:"Su rotura permite que el tendón del bíceps se luxe medialmente, con chasquido doloroso al rotar el brazo."},
lig_colateral_cubital:{cat:"ligamento", grupo:"Articulación del codo", nombre:"Ligamento colateral cubital", latin:"Ligamentum collaterale ulnare",
  resumen:"Ligamento triangular en la cara medial del codo, con bandas anterior, posterior y oblicua.",
  une:"Epicóndilo medial del húmero con la apófisis coronoides y el olécranon del cúbito.", funcion:"Principal estabilizador del codo frente a las fuerzas en valgo (que abren el lado medial).",
  clinica:"Se rompe en lanzadores de béisbol y jabalinistas; su reconstrucción se conoce como cirugía de Tommy John."},
lig_colateral_radial:{cat:"ligamento", grupo:"Articulación del codo", nombre:"Ligamento colateral radial", latin:"Ligamentum collaterale radiale",
  resumen:"Abanico fibroso en la cara lateral del codo.",
  une:"Epicóndilo lateral del húmero con el ligamento anular del radio.", funcion:"Estabiliza el codo frente a fuerzas en varo y sujeta el ligamento anular.",
  clinica:"Su lesión participa en la inestabilidad posterolateral del codo tras luxaciones."},
lig_anular_radio:{cat:"ligamento", grupo:"Articulación radiocubital proximal", nombre:"Ligamento anular del radio", latin:"Ligamentum anulare radii",
  resumen:"Anillo fibroso que rodea la cabeza del radio y la sujeta al cúbito, permitiéndole girar.",
  une:"Bordes anterior y posterior de la escotadura radial del cúbito, rodeando la cabeza del radio.", funcion:"Mantiene la cabeza del radio en su sitio durante la pronación y la supinación.",
  clinica:"En niños menores de 5 años, un tirón del brazo puede deslizar la cabeza del radio bajo el ligamento: es el «codo de niñera» o pronación dolorosa, que se reduce con una maniobra sencilla."},
membrana_interosea:{cat:"ligamento", grupo:"Antebrazo", nombre:"Membrana interósea del antebrazo", latin:"Membrana interossea antebrachii",
  resumen:"Lámina fibrosa entre el radio y el cúbito, con fibras que bajan oblicuas del radio al cúbito.",
  une:"Bordes interóseos del radio y del cúbito.", funcion:"Transmite al cúbito las fuerzas que llegan de la mano al radio y separa los compartimentos anterior y posterior del antebrazo.",
  clinica:"Su lesión en fracturas de la cabeza del radio forma parte de la lesión de Essex-Lopresti."},
/* ---------------- HUESOS ---------------- */
clavicula:{cat:"hueso", grupo:"Cintura escapular", nombre:"Clavícula", latin:"Clavicula",
  resumen:"Hueso largo en forma de S que actúa como puntal entre el esternón y la escápula. Mantiene el brazo separado del tronco.",
  partes:"Extremo esternal (medial, grueso), extremo acromial (lateral, aplanado), cuerpo, tubérculo conoideo, línea trapezoidea, impresión costoclavicular y surco del subclavio.",
  articula:"Con el manubrio del esternón (articulación esternoclavicular) y con el acromion (articulación acromioclavicular).",
  clinica:"Es el hueso que más se fractura, casi siempre en su tercio medio por caídas sobre el hombro o la mano. Es el primer hueso en osificarse (quinta semana del embarazo)."},
escapula:{cat:"hueso", grupo:"Cintura escapular", nombre:"Escápula (omóplato)", latin:"Scapula",
  resumen:"Hueso plano y triangular en la parte posterior del tórax, entre las costillas 2 y 7. Da inserción a 17 músculos.",
  partes:"Bordes medial, lateral y superior; ángulos superior, inferior y lateral; espina, acromion, apófisis coracoides, cavidad glenoidea, tubérculos supraglenoideo e infraglenoideo, fosas supraespinosa, infraespinosa y subescapular, y escotadura supraescapular.",
  articula:"Con el húmero (articulación glenohumeral) y con la clavícula (acromioclavicular). Se desliza sobre el tórax (articulación escapulotorácica, funcional).",
  clinica:"Sus fracturas son poco frecuentes porque la protegen músculos gruesos; indican traumatismos de gran energía."},
humero:{cat:"hueso", grupo:"Brazo", nombre:"Húmero", latin:"Humerus",
  resumen:"El hueso más largo del miembro superior. Une el hombro con el codo.",
  partes:"Cabeza, cuello anatómico, cuello quirúrgico, tubérculos mayor y menor, surco intertubercular, tuberosidad deltoidea, surco del nervio radial, crestas supracondíleas, epicóndilos medial y lateral, tróclea, capítulo y fosas coronoidea, radial y olecraniana.",
  articula:"Con la escápula (hombro) y con el cúbito y el radio (codo).",
  clinica:"Cada zona de fractura pone en riesgo un nervio: cuello quirúrgico, nervio axilar; diáfisis, nervio radial; región supracondílea, arteria braquial y nervio mediano; epicóndilo medial, nervio cubital."},
radio:{cat:"hueso", grupo:"Antebrazo", nombre:"Radio", latin:"Radius",
  resumen:"Hueso lateral del antebrazo (del lado del pulgar). Gira alrededor del cúbito para pronar y supinar.",
  partes:"Cabeza, cuello, tuberosidad del radio, cuerpo con borde interóseo, extremo distal ancho, escotadura cubital y apófisis estiloides.",
  articula:"Con el capítulo del húmero, con el cúbito (radiocubitales proximal y distal) y con los huesos del carpo.",
  clinica:"La fractura del extremo distal (fractura de Colles) es una de las más frecuentes en adultos mayores, por caídas con la mano extendida."},
cubito:{cat:"hueso", grupo:"Antebrazo", nombre:"Cúbito (ulna)", latin:"Ulna",
  resumen:"Hueso medial del antebrazo. Forma con el húmero la bisagra del codo.",
  partes:"Olécranon, apófisis coronoides, escotadura troclear, escotadura radial, tuberosidad del cúbito, cuerpo con borde interóseo, cabeza y apófisis estiloides.",
  articula:"Con la tróclea del húmero (codo) y con el radio (radiocubitales proximal y distal).",
  clinica:"El olécranon es la punta del codo que se apoya en la mesa; su fractura suele requerir cirugía porque el tríceps separa los fragmentos."},
esternon:{cat:"hueso", grupo:"Tórax (contexto)", nombre:"Esternón", latin:"Sternum",
  resumen:"Hueso plano en el centro del pecho. Se compone de manubrio, cuerpo y apófisis xifoides.",
  partes:"Manubrio con escotadura yugular y escotaduras claviculares, ángulo esternal (a nivel de la 2.ª costilla), cuerpo y apófisis xifoides.",
  articula:"Con las clavículas y con los cartílagos costales de las costillas 1 a 7.",
  clinica:"El ángulo esternal es la referencia para contar costillas en la exploración física; la compresión torácica de la reanimación se hace sobre la mitad inferior del esternón."},
costillas:{cat:"hueso", grupo:"Tórax (contexto)", nombre:"Costillas y cartílagos costales", latin:"Costae et cartilagines costales",
  resumen:"Doce pares de huesos curvos que forman la caja torácica. Aquí se muestran como contexto del hombro.",
  partes:"Costillas verdaderas (1–7, llegan al esternón), falsas (8–10, se unen al cartílago de arriba) y flotantes (11–12). Cada una tiene cabeza, cuello, tubérculo, ángulo y cuerpo.",
  articula:"Con las vértebras torácicas por detrás y con el esternón por delante mediante sus cartílagos.",
  clinica:"El serrato anterior, el pectoral menor y el subclavio nacen de ellas. Las fracturas costales suelen ocurrir en el ángulo posterior."},
columna:{cat:"hueso", grupo:"Tronco (contexto)", nombre:"Columna vertebral (C1–L2)", latin:"Columna vertebralis",
  resumen:"Vértebras cervicales, torácicas y primeras lumbares, mostradas como anclaje de los músculos de la espalda.",
  partes:"Cuerpo, arco vertebral, apófisis transversas y apófisis espinosas. C7 tiene la espinosa más prominente del cuello (vértebra prominente).",
  articula:"Entre sí mediante discos intervertebrales y articulaciones facetarias; con las costillas a nivel torácico.",
  clinica:"De sus espinosas nacen el trapecio, los romboides y el dorsal ancho. La espinosa de C7 sirve para contar vértebras al palpar la espalda."},
/* ---------------- NERVIOS ---------------- */
plexo_braquial:{cat:"nervio", grupo:"Plexo braquial", nombre:"Plexo braquial", latin:"Plexus brachialis",
  resumen:"Red de nervios que inerva todo el miembro superior. Se organiza en raíces, troncos, divisiones, fascículos y ramos terminales.",
  raices:"Ramos anteriores de C5, C6, C7, C8 y T1.",
  trayecto:"Sale entre los músculos escalenos, pasa detrás de la clavícula y llega a la axila rodeando la arteria axilar. Troncos superior (C5–C6), medio (C7) e inferior (C8–T1); fascículos lateral, posterior y medial según su posición respecto a la arteria.",
  inerva:"Todo el miembro superior: hombro, brazo, antebrazo y mano.",
  clinica:"Parálisis de Erb-Duchenne (raíces altas C5–C6): brazo colgando en rotación medial, «posición de mesero pidiendo propina». Parálisis de Klumpke (C8–T1): mano en garra."},
n_axilar:{cat:"nervio", grupo:"Ramos terminales", nombre:"Nervio axilar (circunflejo)", latin:"Nervus axillaris",
  resumen:"Ramo terminal del fascículo posterior que rodea el cuello quirúrgico del húmero.",
  raices:"C5–C6, del fascículo posterior.",
  trayecto:"Atraviesa el espacio cuadrangular junto con la arteria circunfleja humeral posterior y rodea por detrás el cuello quirúrgico del húmero.",
  inerva:"Músculos deltoides y redondo menor; piel de la cara lateral del hombro.",
  clinica:"Se lesiona en fracturas del cuello quirúrgico y luxaciones anteriores del hombro: pérdida de la abducción y anestesia en el «parche de sargento»."},
n_musculocutaneo:{cat:"nervio", grupo:"Ramos terminales", nombre:"Nervio musculocutáneo", latin:"Nervus musculocutaneus",
  resumen:"Ramo terminal del fascículo lateral. Inerva los flexores del brazo.",
  raices:"C5–C7, del fascículo lateral.",
  trayecto:"Perfora el coracobraquial, baja entre el bíceps y el braquial y termina como nervio cutáneo lateral del antebrazo.",
  inerva:"Coracobraquial, bíceps braquial y braquial; piel de la cara lateral del antebrazo.",
  clinica:"Su lesión aislada es rara; debilita mucho la flexión del codo y la supinación, y disminuye el reflejo bicipital."},
n_mediano:{cat:"nervio", grupo:"Ramos terminales", nombre:"Nervio mediano", latin:"Nervus medianus",
  resumen:"Nace de la unión de los fascículos lateral y medial en forma de «M». Baja por el centro del brazo sin dar ramas.",
  raices:"C6–T1, de los fascículos lateral y medial.",
  trayecto:"Acompaña a la arteria braquial en la cara medial del brazo, cruza la fosa del codo medial al tendón del bíceps, pasa entre las cabezas del pronador redondo y llega a la mano por el túnel carpiano.",
  inerva:"La mayoría de los flexores del antebrazo, músculos de la eminencia tenar y piel de la palma desde el pulgar hasta la mitad del anular.",
  clinica:"En la muñeca causa el síndrome del túnel carpiano. Una lesión alta produce la «mano del predicador» al intentar cerrar el puño."},
n_cubital:{cat:"nervio", grupo:"Ramos terminales", nombre:"Nervio cubital (ulnar)", latin:"Nervus ulnaris",
  resumen:"Ramo terminal del fascículo medial. Pasa detrás del epicóndilo medial: es el «hueso de la risa».",
  raices:"C8–T1, del fascículo medial.",
  trayecto:"Baja por la cara medial del brazo, atraviesa el tabique intermuscular medial, pasa por detrás del epicóndilo medial (túnel cubital) y entra en el antebrazo entre las cabezas del flexor cubital del carpo.",
  inerva:"Flexor cubital del carpo, mitad medial del flexor profundo de los dedos, casi todos los músculos pequeños de la mano y piel del meñique y mitad del anular.",
  clinica:"Su compresión en el codo provoca hormigueo en el meñique y debilidad de la mano; una lesión crónica produce la mano en garra cubital."},
n_radial:{cat:"nervio", grupo:"Ramos terminales", nombre:"Nervio radial", latin:"Nervus radialis",
  resumen:"El ramo más grande del plexo braquial. Inerva todos los extensores del brazo y del antebrazo.",
  raices:"C5–T1, del fascículo posterior.",
  trayecto:"Pasa por el espacio triangular inferior, rodea la cara posterior del húmero por el surco del nervio radial con la arteria braquial profunda, perfora el tabique lateral y, delante del epicóndilo lateral, se divide en ramo superficial (sensitivo) y profundo (motor, atraviesa el supinador).",
  inerva:"Tríceps, ancóneo, braquiorradial, extensores del antebrazo y piel de la cara posterior del brazo, del antebrazo y del dorso de la mano.",
  clinica:"Las fracturas de la diáfisis del húmero o dormir con el brazo apoyado («parálisis del sábado por la noche») causan mano caída: no se puede extender la muñeca."},
n_supraescapular:{cat:"nervio", grupo:"Ramos supraclaviculares", nombre:"Nervio supraescapular", latin:"Nervus suprascapularis",
  resumen:"Nace del tronco superior y llega a la parte posterior de la escápula.",
  raices:"C5–C6, del tronco superior.",
  trayecto:"Cruza el triángulo posterior del cuello, pasa por debajo del ligamento transverso superior de la escápula, inerva el supraespinoso y rodea la espina por la escotadura espinoglenoidea hasta el infraespinoso.",
  inerva:"Supraespinoso e infraespinoso; ramos articulares al hombro.",
  clinica:"Su compresión produce dolor profundo del hombro y debilidad para iniciar la abducción y la rotación externa. Se bloquea con anestésico para cirugías del hombro."},
n_toracico_largo:{cat:"nervio", grupo:"Ramos supraclaviculares", nombre:"Nervio torácico largo (de Bell)", latin:"Nervus thoracicus longus",
  resumen:"Nervio largo y superficial en la pared lateral del tórax.",
  raices:"C5–C7, directamente de las raíces.",
  trayecto:"Baja por detrás del plexo braquial y luego sobre la cara externa del serrato anterior, a lo largo de la línea axilar media.",
  inerva:"Músculo serrato anterior.",
  clinica:"Por su trayecto superficial se lesiona en cirugías de axila y mama o por cargar peso: provoca escápula alada."},
n_toracodorsal:{cat:"nervio", grupo:"Ramos infraclaviculares", nombre:"Nervio toracodorsal", latin:"Nervus thoracodorsalis",
  resumen:"Ramo del fascículo posterior que baja por la pared posterior de la axila.",
  raices:"C6–C8, del fascículo posterior.",
  trayecto:"Desciende junto a la arteria toracodorsal por la pared posterior de la axila hasta la cara profunda del dorsal ancho.",
  inerva:"Músculo dorsal ancho.",
  clinica:"Se debe preservar en la cirugía de ganglios axilares y cuando se usa el dorsal ancho como colgajo."},
n_accesorio:{cat:"nervio", grupo:"Nervios craneales", nombre:"Nervio accesorio (NC XI)", latin:"Nervus accessorius",
  resumen:"Nervio craneal que baja por el cuello para inervar el trapecio y el esternocleidomastoideo.",
  raices:"Núcleo espinal del accesorio, en los segmentos C1–C5 de la médula.",
  trayecto:"Sale del cráneo por el agujero yugular, atraviesa el esternocleidomastoideo y cruza el triángulo posterior del cuello hasta la cara profunda del trapecio.",
  inerva:"Músculos esternocleidomastoideo y trapecio.",
  clinica:"Su trayecto superficial en el triángulo posterior lo expone en biopsias de ganglios del cuello: produce caída del hombro."},
/* ---------------- ARTERIAS ---------------- */
a_subclavia:{cat:"arteria", grupo:"Tronco arterial", nombre:"Arteria subclavia", latin:"Arteria subclavia",
  resumen:"Arteria principal hacia el miembro superior. La derecha nace del tronco braquiocefálico.",
  origen:"Derecha: tronco braquiocefálico. Izquierda: directamente del arco aórtico.",
  trayecto:"Se arquea sobre la cúpula pleural y la primera costilla, detrás del escaleno anterior.",
  ramas:"Arteria vertebral, torácica interna, tronco tirocervical (que da la supraescapular y la cervical transversa) y tronco costocervical.",
  irriga:"Cuello, encéfalo (vertebral), pared torácica y miembro superior.",
  clinica:"Puede comprimirse entre los escalenos o contra la primera costilla (síndrome del desfiladero torácico). Cambia de nombre a arteria axilar en el borde lateral de la primera costilla."},
a_axilar:{cat:"arteria", grupo:"Tronco arterial", nombre:"Arteria axilar", latin:"Arteria axillaris",
  resumen:"Continúa a la subclavia a través de la axila. El pectoral menor la divide en tres partes.",
  origen:"Borde lateral de la primera costilla (continuación de la arteria subclavia).",
  trayecto:"Atraviesa la axila rodeada por los fascículos del plexo braquial; termina en el borde inferior del redondo mayor, donde pasa a llamarse arteria braquial.",
  ramas:"1.ª parte: torácica superior. 2.ª parte: toracoacromial y torácica lateral. 3.ª parte: subescapular, circunfleja humeral anterior y circunfleja humeral posterior (regla 1-2-3).",
  irriga:"Pared torácica, hombro, mama y músculos de la axila.",
  clinica:"Gracias a la anastomosis escapular, si se liga entre la subescapular y la tirocervical la sangre puede seguir llegando al brazo."},
a_toracoacromial:{cat:"arteria", grupo:"Ramas de la axilar", nombre:"Arteria toracoacromial", latin:"Arteria thoracoacromialis",
  resumen:"Tronco corto que perfora la fascia clavipectoral y se abre en cuatro ramas.",
  origen:"Segunda parte de la arteria axilar.",
  trayecto:"Perfora la fascia clavipectoral junto al borde superior del pectoral menor.",
  ramas:"Pectoral, deltoidea, acromial y clavicular.",
  irriga:"Músculos pectorales, deltoides, articulación acromioclavicular y subclavio.",
  clinica:"Su rama pectoral es la base del colgajo de pectoral mayor usado en reconstrucciones de cabeza y cuello."},
a_subescapular:{cat:"arteria", grupo:"Ramas de la axilar", nombre:"Arteria subescapular", latin:"Arteria subscapularis",
  resumen:"La rama más grande de la arteria axilar.",
  origen:"Tercera parte de la arteria axilar.",
  trayecto:"Baja por el borde lateral del subescapular y se divide en arteria circunfleja escapular (pasa por el espacio triangular hacia la fosa infraespinosa) y arteria toracodorsal.",
  ramas:"Circunfleja escapular y toracodorsal.",
  irriga:"Subescapular, redondo mayor, dorsal ancho, serrato anterior e infraespinoso.",
  clinica:"Forma parte de la anastomosis escapular, que conecta la subclavia con la axilar alrededor de la escápula."},
a_circunfleja_humeral_posterior:{cat:"arteria", grupo:"Ramas de la axilar", nombre:"Arteria circunfleja humeral posterior", latin:"Arteria circumflexa humeri posterior",
  resumen:"Rodea por detrás el cuello quirúrgico del húmero, acompañando al nervio axilar.",
  origen:"Tercera parte de la arteria axilar.",
  trayecto:"Atraviesa el espacio cuadrangular con el nervio axilar y rodea el cuello quirúrgico del húmero.",
  ramas:"Ramas musculares y articulares; se anastomosa con la circunfleja anterior y la braquial profunda.",
  irriga:"Deltoides, articulación del hombro y cabeza larga del tríceps.",
  clinica:"Se lesiona junto con el nervio axilar en las fracturas del cuello quirúrgico."},
a_circunfleja_humeral_anterior:{cat:"arteria", grupo:"Ramas de la axilar", nombre:"Arteria circunfleja humeral anterior", latin:"Arteria circumflexa humeri anterior",
  resumen:"Rama pequeña que rodea por delante el cuello quirúrgico del húmero.",
  origen:"Tercera parte de la arteria axilar.",
  trayecto:"Pasa por delante del cuello quirúrgico, bajo el coracobraquial y el bíceps.",
  ramas:"Rama ascendente que sube por el surco intertubercular hacia la cabeza del húmero.",
  irriga:"Cabeza del húmero y articulación del hombro.",

  inervacion:"Nervio interóseo posterior (C7–C8).",
  irrigacion:"Arteria interósea posterior.",
  accion:"Abduce y extiende el pulgar en la articulación trapeciometacarpiana; ayuda a desviar la muñeca hacia el lado radial.",
  clinica:"Comparte con el extensor corto del pulgar el 1.er compartimento extensor. Su inflamación es la tenosinovitis de De Quervain: dolor en la apófisis estiloides del radio, frecuente en madres recientes y al usar el celular con el pulgar.",
  prueba:"Prueba de Finkelstein: pulgar dentro del puño y desviar la muñeca hacia el lado cubital reproduce el dolor."},
extensor_corto_pulgar:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior del antebrazo", nombre:"Extensor corto del pulgar", latin:"Musculus extensor pollicis brevis",
  resumen:"Pequeño extensor del pulgar que, con el abductor largo, forma el borde anterior de la tabaquera anatómica.",
  origen:"Cara posterior del tercio distal del radio y membrana interósea.",
  insercion:"Base de la falange proximal del pulgar, por su cara dorsal.",
  inervacion:"Nervio interóseo posterior (C7–C8).",
  irrigacion:"Arteria interósea posterior.",
  accion:"Extiende la metacarpofalángica y la trapeciometacarpiana del pulgar.",
  clinica:"Límite lateral (anterior) de la tabaquera anatómica, donde se palpan el escafoides y la arteria radial. Se afecta en la tenosinovitis de De Quervain.",
  prueba:"Extender el pulgar contra resistencia sobre la falange proximal; se marca el borde de la tabaquera."},
extensor_largo_pulgar:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior del antebrazo", nombre:"Extensor largo del pulgar", latin:"Musculus extensor pollicis longus",
  resumen:"Su tendón gira alrededor del tubérculo dorsal del radio (de Lister) como una polea y forma el borde posterior de la tabaquera anatómica.",
  origen:"Tercio medio de la cara posterior del cúbito y membrana interósea.",
  insercion:"Base de la falange distal del pulgar, por su cara dorsal.",
  inervacion:"Nervio interóseo posterior (C7–C8).",
  irrigacion:"Arteria interósea posterior.",
  accion:"Extiende todas las articulaciones del pulgar y lo lleva hacia atrás (retroposición).",
  clinica:"Puede romperse semanas después de una fractura de Colles, incluso sin desplazamiento, por roce o mala irrigación junto al tubérculo de Lister. Se repara transfiriendo el extensor del índice.",
  prueba:"Con la mano plana sobre la mesa, levantar el pulgar hacia arriba."},
extensor_indice:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior del antebrazo", nombre:"Extensor del índice", latin:"Musculus extensor indicis",
  resumen:"Músculo profundo que permite extender el índice por separado, por ejemplo para señalar.",
  origen:"Cara posterior del tercio distal del cúbito y membrana interósea.",
  insercion:"Expansión extensora del índice, medial al tendón del extensor de los dedos.",
  inervacion:"Nervio interóseo posterior (C7–C8).",
  irrigacion:"Arteria interósea posterior.",
  accion:"Extiende el índice y ayuda a extender la muñeca.",
  clinica:"Su tendón es el más usado en transferencias tendinosas, por ejemplo para reemplazar un extensor largo del pulgar roto.",
  prueba:"Con el puño cerrado, extender solo el índice."},

/* ---------------- MANO · TENAR, HIPOTENAR E INTRÍNSECOS ---------------- */
abductor_corto_pulgar:{cat:"musculo", capa:"Superficial", grupo:"Eminencia tenar", nombre:"Abductor corto del pulgar", latin:"Musculus abductor pollicis brevis",
  resumen:"El músculo más superficial de la eminencia tenar. Separa el pulgar de la palma hacia delante.",
  origen:"Retináculo de los flexores y tubérculos del escafoides y del trapecio.",
  insercion:"Lado lateral de la base de la falange proximal del pulgar.",
  inervacion:"Ramo recurrente del nervio mediano (C8–T1).",
  irrigacion:"Rama palmar superficial de la arteria radial.",
  accion:"Abduce el pulgar (lo separa de la palma en ángulo recto) y ayuda a la oposición.",
  clinica:"Es el primero en atrofiarse en el síndrome del túnel carpiano, con aplanamiento de la eminencia tenar. Es el mejor músculo para valorar el nervio mediano.",
  prueba:"Con la palma hacia arriba, levantar el pulgar hacia el techo contra resistencia."},
flexor_corto_pulgar:{cat:"musculo", capa:"Superficial", grupo:"Eminencia tenar", nombre:"Flexor corto del pulgar", latin:"Musculus flexor pollicis brevis",
  resumen:"Músculo tenar medial al abductor corto, con dos cabezas que a menudo tienen distinta inervación.",
  origen:"Cabeza superficial: retináculo de los flexores y trapecio. Cabeza profunda: trapezoide y hueso grande.",
  insercion:"Base de la falange proximal del pulgar, por el sesamoideo lateral.",
  inervacion:"Cabeza superficial: ramo recurrente del nervio mediano. Cabeza profunda: con frecuencia ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Rama palmar superficial de la arteria radial.",
  accion:"Flexiona la metacarpofalángica del pulgar y ayuda a la oposición.",
  clinica:"Por su doble inervación, la oposición puede conservarse en parte aunque se lesione el mediano.",
  prueba:"Flexionar la metacarpofalángica del pulgar manteniendo la punta extendida."},
oponente_pulgar:{cat:"musculo", capa:"Profundo", grupo:"Eminencia tenar", nombre:"Oponente del pulgar", latin:"Musculus opponens pollicis",
  resumen:"Músculo tenar profundo que gira el pulgar para enfrentarlo a los demás dedos. Es lo que hace única a la mano humana.",
  origen:"Retináculo de los flexores y tubérculo del trapecio.",
  insercion:"Todo el borde lateral del 1.er metacarpiano.",
  inervacion:"Ramo recurrente del nervio mediano (C8–T1).",
  irrigacion:"Rama palmar superficial de la arteria radial.",
  accion:"Oposición: flexiona y rota el 1.er metacarpiano para que el pulpejo del pulgar mire al de los otros dedos.",
  clinica:"Sin oposición no hay pinza fina; en lesiones altas del mediano el pulgar queda al lado de los dedos (mano de simio).",
  prueba:"Tocar la punta del meñique con la punta del pulgar y resistir mientras se intenta separarlos."},
aductor_pulgar:{cat:"musculo", capa:"Profundo", grupo:"Compartimento aductor", nombre:"Aductor del pulgar", latin:"Musculus adductor pollicis",
  resumen:"Músculo profundo en abanico entre el pulgar y el 3.er metacarpiano, con cabezas oblicua y transversa.",
  origen:"Cabeza oblicua: hueso grande y bases del 2.º y 3.er metacarpianos. Cabeza transversa: cara palmar del cuerpo del 3.er metacarpiano.",
  insercion:"Lado medial de la base de la falange proximal del pulgar, por el sesamoideo medial.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Arco palmar profundo.",
  accion:"Aduce el pulgar (lo acerca a la palma) y da fuerza a la pinza lateral, como al sujetar una llave.",
  clinica:"Signo de Froment: en una lesión del cubital, al sujetar un papel entre pulgar e índice, la punta del pulgar se dobla porque el flexor largo intenta suplir al aductor.",
  prueba:"Sujetar una hoja entre el pulgar y el borde del índice mientras el examinador la jala (signo de Froment)."},
abductor_menique:{cat:"musculo", capa:"Superficial", grupo:"Eminencia hipotenar", nombre:"Abductor del meñique", latin:"Musculus abductor digiti minimi manus",
  resumen:"El músculo más superficial y medial de la eminencia hipotenar. Separa el meñique.",
  origen:"Pisiforme y tendón del flexor cubital del carpo.",
  insercion:"Lado medial de la base de la falange proximal del meñique y su expansión extensora.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Rama palmar profunda de la arteria cubital.",
  accion:"Abduce el meñique y ayuda a flexionar su metacarpofalángica.",
  clinica:"Signo de Wartenberg: en una lesión cubital el meñique queda separado de los demás dedos porque su extensor actúa sin oposición.",
  prueba:"Separar el meñique contra resistencia."},
flexor_corto_menique:{cat:"musculo", capa:"Superficial", grupo:"Eminencia hipotenar", nombre:"Flexor corto del meñique", latin:"Musculus flexor digiti minimi brevis manus",
  resumen:"Pequeño músculo hipotenar, lateral al abductor del meñique; a veces falta o está fusionado.",
  origen:"Gancho del ganchoso y retináculo de los flexores.",
  insercion:"Base de la falange proximal del meñique.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Rama palmar profunda de la arteria cubital.",
  accion:"Flexiona la metacarpofalángica del meñique.",
  clinica:"Se atrofia junto con el resto de la eminencia hipotenar cuando se comprime el nervio cubital en el canal de Guyon.",
  prueba:"Flexionar la metacarpofalángica del meñique manteniendo sus articulaciones distales extendidas."},
oponente_menique:{cat:"musculo", capa:"Profundo", grupo:"Eminencia hipotenar", nombre:"Oponente del meñique", latin:"Musculus opponens digiti minimi",
  resumen:"Músculo hipotenar profundo que adelanta y gira el 5.º metacarpiano para ahuecar la palma.",
  origen:"Gancho del ganchoso y retináculo de los flexores.",
  insercion:"Borde medial del 5.º metacarpiano.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Rama palmar profunda de la arteria cubital.",
  accion:"Lleva el 5.º metacarpiano hacia delante y lo rota, acercando el meñique al pulgar.",
  clinica:"Contribuye a ahuecar la mano para beber agua o sujetar objetos redondos.",
  prueba:"Juntar las puntas del pulgar y el meñique ahuecando la palma."},
palmar_corto:{cat:"musculo", capa:"Superficial", grupo:"Eminencia hipotenar", nombre:"Palmar corto", latin:"Musculus palmaris brevis",
  resumen:"Músculo cutáneo muy delgado y superficial sobre la eminencia hipotenar.",
  origen:"Aponeurosis palmar y retináculo de los flexores.",
  insercion:"Piel del borde medial de la palma.",
  inervacion:"Ramo superficial del nervio cubital (C8).",
  irrigacion:"Arteria cubital.",
  accion:"Arruga la piel de la eminencia hipotenar, mejora el agarre y protege el nervio y la arteria cubitales.",
  clinica:"Si se forma su hoyuelo al separar con fuerza el meñique, el ramo superficial del cubital funciona.",
  prueba:"Separar el meñique con fuerza y observar las arrugas en la eminencia hipotenar."},
lumbricales:{cat:"musculo", capa:"Profundo", grupo:"Músculos intrínsecos de la mano", nombre:"Lumbricales", latin:"Musculi lumbricales manus",
  resumen:"Cuatro músculos pequeños con forma de lombriz que nacen de los tendones del flexor profundo dentro de la palma.",
  origen:"Tendones del flexor profundo de los dedos: el 1.º y 2.º de un solo tendón (unipennados); el 3.º y 4.º de dos tendones vecinos (bipennados).",
  insercion:"Lado radial (lateral) de las expansiones extensoras de los dedos 2–5.",
  inervacion:"1.º y 2.º: nervio mediano (digitales palmares). 3.º y 4.º: ramo profundo del nervio cubital.",
  irrigacion:"Arcos palmares superficial y profundo.",
  accion:"Flexionan las metacarpofalángicas y extienden las interfalángicas a la vez (posición de escribir o de «mesa»).",
  clinica:"En una lesión del cubital, anular y meñique quedan en garra (nudillos extendidos y dedos doblados) porque fallan sus lumbricales. Índice y medio se salvan porque sus lumbricales dependen del mediano.",
  prueba:"Flexionar los nudillos con los dedos extendidos contra resistencia."},
interoseos_dorsales:{cat:"musculo", capa:"Profundo", grupo:"Músculos intrínsecos de la mano", nombre:"Interóseos dorsales", latin:"Musculi interossei dorsales manus",
  resumen:"Cuatro músculos bipennados que llenan los espacios entre los metacarpianos. Separan los dedos en abanico.",
  origen:"Lados vecinos de los dos metacarpianos de cada espacio.",
  insercion:"Bases de las falanges proximales y expansiones extensoras: lado lateral del índice, ambos lados del medio y lado medial del anular.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Arco palmar profundo y arterias metacarpianas dorsales.",
  accion:"Abducen los dedos alejándolos del eje del dedo medio. Ayudan a flexionar los nudillos y extender las interfalángicas.",
  clinica:"La atrofia del 1.er interóseo dorsal deja un hueco visible entre pulgar e índice, signo típico de lesión del nervio cubital. Mnemotecnia: dorsales separan, palmares juntan.",
  prueba:"Separar los dedos en abanico contra resistencia, palpando el 1.er interóseo al separar el índice."},
interoseos_palmares:{cat:"musculo", capa:"Profundo", grupo:"Músculos intrínsecos de la mano", nombre:"Interóseos palmares", latin:"Musculi interossei palmares",
  resumen:"Tres músculos unipennados en la cara palmar de los metacarpianos. Juntan los dedos hacia el dedo medio.",
  origen:"Cara medial del 2.º metacarpiano y caras laterales del 4.º y del 5.º.",
  insercion:"Falange proximal y expansión extensora del mismo dedo: índice, anular y meñique.",
  inervacion:"Ramo profundo del nervio cubital (C8–T1).",
  irrigacion:"Arco palmar profundo y arterias metacarpianas palmares.",
  accion:"Aducen los dedos acercándolos al eje del dedo medio. Ayudan a flexionar los nudillos y extender las interfalángicas.",
  clinica:"En una lesión del cubital la persona no puede sostener una tarjeta entre los dedos juntos y extendidos.",
  prueba:"Sujetar una tarjeta entre dos dedos extendidos mientras el examinador intenta sacarla."},

/* ---------------- LIGAMENTOS Y RETINÁCULOS ---------------- */
retinaculo_flexores:{cat:"ligamento", grupo:"Muñeca", nombre:"Retináculo de los flexores", latin:"Retinaculum musculorum flexorum",
  resumen:"Banda fibrosa gruesa (ligamento transverso del carpo) que cierra por delante el surco de los huesos del carpo y forma el túnel carpiano.",
  une:"Tubérculos del escafoides y del trapecio (lado lateral) con el pisiforme y el gancho del ganchoso (lado medial).",
  funcion:"Forma el túnel carpiano, por donde pasan el nervio mediano y nueve tendones (cuatro del flexor superficial, cuatro del profundo y el flexor largo del pulgar). Sirve de polea a los flexores y de origen a músculos tenares e hipotenares.",
  clinica:"Síndrome del túnel carpiano: compresión del mediano con hormigueo nocturno en pulgar, índice, medio y mitad del anular. Las pruebas de Phalen (muñecas flexionadas 60 segundos) y Tinel (golpear sobre el túnel) reproducen los síntomas. La cirugía corta este retináculo."},
retinaculo_extensores:{cat:"ligamento", grupo:"Muñeca", nombre:"Retináculo de los extensores", latin:"Retinaculum musculorum extensorum",
  resumen:"Banda fibrosa en el dorso de la muñeca que sujeta los tendones extensores y los separa en seis compartimentos.",
  une:"Borde anterolateral del radio distal con el piramidal, el pisiforme y la apófisis estiloides del cúbito; manda tabiques al radio y al cúbito.",
  funcion:"Evita que los extensores se separen del hueso al extender la muñeca. Compartimentos: 1) abductor largo y extensor corto del pulgar; 2) extensores radiales del carpo; 3) extensor largo del pulgar; 4) extensor de los dedos y del índice; 5) extensor del meñique; 6) extensor cubital del carpo.",
  clinica:"Cada compartimento puede inflamarse (tenosinovitis). El más afectado es el primero: tenosinovitis de De Quervain."},
lig_radiocarpianos_palmares:{cat:"ligamento", grupo:"Articulación radiocarpiana", nombre:"Ligamentos radiocarpianos palmares", latin:"Ligamenta radiocarpalia palmaria",
  resumen:"Grupo de ligamentos fuertes en la cara anterior de la muñeca: radioescafogrande, radiosemilunar largo y radiosemilunar corto.",
  une:"Borde anterior del radio distal con el escafoides, el semilunar y el hueso grande.",
  funcion:"Son los principales estabilizadores de la muñeca: impiden que el carpo se deslice hacia el lado cubital y hacia delante, y guían la flexión y la extensión.",
  clinica:"Su lesión junto con la del ligamento escafosemilunar, en caídas sobre la mano, causa inestabilidad del carpo y artrosis precoz si no se trata."},
lig_radiocarpianos_dorsales:{cat:"ligamento", grupo:"Articulación radiocarpiana", nombre:"Ligamento radiocarpiano dorsal", latin:"Ligamentum radiocarpale dorsale",
  resumen:"Ligamento oblicuo en el dorso de la muñeca que baja del radio al semilunar y al piramidal.",
  une:"Borde posterior del radio distal con el semilunar y el piramidal.",
  funcion:"Limita la flexión de la muñeca y hace que la mano acompañe al radio durante la pronación y la supinación.",
  clinica:"Cerca de él, sobre todo junto al ligamento escafosemilunar, nacen los gangliones dorsales (quistes sinoviales), los bultos más frecuentes de la muñeca."},
lig_colateral_radial_carpo:{cat:"ligamento", grupo:"Articulación radiocarpiana", nombre:"Ligamento colateral radial del carpo", latin:"Ligamentum collaterale carpi radiale",
  resumen:"Refuerzo lateral de la cápsula de la muñeca.",
  une:"Apófisis estiloides del radio con el tubérculo del escafoides y el trapecio.",
  funcion:"Limita la desviación cubital (aducción) de la muñeca.",
  clinica:"Se lesiona en esguinces de muñeca. La arteria radial pasa muy cerca, en el fondo de la tabaquera anatómica."},
lig_colateral_cubital_carpo:{cat:"ligamento", grupo:"Articulación radiocarpiana", nombre:"Ligamento colateral cubital del carpo", latin:"Ligamentum collaterale carpi ulnare",
  resumen:"Refuerzo medial de la cápsula de la muñeca, en forma de abanico.",
  une:"Apófisis estiloides del cúbito con el piramidal y el pisiforme.",
  funcion:"Limita la desviación radial (abducción) de la muñeca.",
  clinica:"Forma parte, con el fibrocartílago triangular, del complejo estabilizador del lado cubital de la muñeca."},
fibrocartilago_triangular:{cat:"ligamento", grupo:"Articulación radiocubital distal", nombre:"Fibrocartílago triangular", latin:"Discus articularis (complexus fibrocartilagineus triangularis)",
  resumen:"Disco de cartílago fibroso entre la cabeza del cúbito y el carpo, centro del complejo del fibrocartílago triangular.",
  une:"Borde medial de la escotadura cubital del radio con la base de la apófisis estiloides del cúbito.",
  funcion:"Separa el cúbito de la articulación radiocarpiana, amortigua cerca del 20 % de la carga de la muñeca y estabiliza la articulación radiocubital distal.",
  clinica:"Se lesiona en caídas o giros forzados (raqueta, golf): dolor en el lado cubital de la muñeca al girar la llave o apoyarse en la mano. Se ve con resonancia o artroscopia."},
aponeurosis_palmar:{cat:"ligamento", grupo:"Palma de la mano", nombre:"Aponeurosis palmar", latin:"Aponeurosis palmaris",
  resumen:"Lámina fibrosa triangular bajo la piel de la palma, con el vértice en la muñeca y bandas hacia los dedos.",
  une:"Tendón del palmar largo y retináculo de los flexores con las bases de los dedos 2–5 (bandas pretendinosas) y con la piel de la palma.",
  funcion:"Protege los tendones, vasos y nervios de la palma y fija la piel para un agarre firme.",
  clinica:"Contractura de Dupuytren: se engrosa y forma cordones que doblan poco a poco anular y meñique hasta que no se pueden extender. Es más frecuente en hombres mayores, con diabetes o antecedentes familiares."},
poleas_flexoras:{cat:"ligamento", grupo:"Dedos", nombre:"Poleas flexoras (vainas fibrosas)", latin:"Vaginae fibrosae digitorum manus",
  resumen:"Anillos fibrosos que sujetan los tendones flexores contra las falanges como las guías de una caña de pescar.",
  une:"Poleas anulares A1–A5 y cruciformes C1–C3 entre los bordes de las falanges y las placas palmares de las articulaciones.",
  funcion:"Mantienen los tendones flexores pegados al hueso para que no se despeguen como cuerda de arco al flexionar. Las más importantes son A2 (falange proximal) y A4 (falange media).",
  clinica:"Dedo en gatillo: el tendón engrosado se traba en la polea A1 y el dedo se queda doblado o se suelta de golpe. Se trata con infiltración o abriendo la polea A1. Los escaladores pueden romper la A2."},
lig_colaterales_dedos:{cat:"ligamento", grupo:"Dedos", nombre:"Ligamentos colaterales de los dedos", latin:"Ligamenta collateralia articulationum manus",
  resumen:"Pares de ligamentos a los lados de cada articulación metacarpofalángica e interfalángica.",
  une:"Cabeza del hueso proximal con la base del hueso distal, a cada lado de la articulación, junto con la placa palmar.",
  funcion:"Dan estabilidad lateral a los dedos. Los de las metacarpofalángicas se tensan en flexión; por eso la mano se inmoviliza con los nudillos doblados.",
  clinica:"El «pulgar del esquiador» es la rotura del colateral cubital de la metacarpofalángica del pulgar; si el aductor queda atrapado entre los cabos (lesión de Stener) necesita cirugía."},
lig_metacarpiano_transverso_profundo:{cat:"ligamento", grupo:"Palma de la mano", nombre:"Ligamento metacarpiano transverso profundo", latin:"Ligamentum metacarpale transversum profundum",
  resumen:"Bandas cortas que unen las cabezas de los metacarpianos 2 a 5 por la cara palmar.",
  une:"Placas palmares de las metacarpofalángicas de los dedos 2–5.",
  funcion:"Mantiene unidas las cabezas de los metacarpianos y forma el arco transverso de la mano. Los lumbricales pasan por delante y los interóseos por detrás.",
  clinica:"Por este ligamento, las fracturas de los metacarpianos centrales (3.º y 4.º) se desplazan poco."},

/* ---------------- NERVIOS ---------------- */
n_interoseo_anterior:{cat:"nervio", grupo:"Ramos del nervio mediano", nombre:"Nervio interóseo anterior", latin:"Nervus interosseus antebrachii anterior",
  resumen:"Ramo motor del nervio mediano que baja sobre la membrana interósea hacia la muñeca.",
  raices:"C7–C8, a través del nervio mediano.",
  trayecto:"Nace del mediano entre las cabezas del pronador redondo y baja sobre la membrana interósea, con la arteria interósea anterior, entre el flexor profundo y el flexor largo del pulgar, hasta el pronador cuadrado.",
  inerva:"Flexor largo del pulgar, mitad lateral del flexor profundo de los dedos (índice y medio) y pronador cuadrado; ramos articulares para la muñeca.",
  clinica:"En el síndrome del interóseo anterior no se puede hacer el «OK» redondo: la pinza de pulgar e índice queda plana. No hay pérdida de sensibilidad porque el nervio es solo motor."},
n_digitales_palmares:{cat:"nervio", grupo:"Nervios de la mano", nombre:"Nervios digitales palmares", latin:"Nervi digitales palmares communes et proprii",
  resumen:"Nervios sensitivos que recorren cada lado de los dedos por su cara palmar. Dan la sensibilidad fina del tacto.",
  raices:"C6–C8, a través de los nervios mediano y cubital.",
  trayecto:"Los nervios digitales comunes nacen en la palma (tres del mediano y uno del ramo superficial del cubital), por debajo del arco palmar superficial. En las comisuras se dividen en digitales propios, que corren por los lados palmares de cada dedo hasta la punta.",
  inerva:"Piel palmar de los dedos y su dorso distal (alrededor de la uña). El mediano da pulgar, índice, medio y mitad lateral del anular; el cubital, mitad medial del anular y meñique. Los del mediano también inervan los lumbricales 1.º y 2.º.",
  clinica:"Se cortan con facilidad en heridas de los dedos, con pérdida de sensibilidad en un lado del pulpejo. La anestesia de un dedo (bloqueo en anillo) se aplica en su base, donde pasan."},

/* ---------------- ARTERIAS ---------------- */
a_radial:{cat:"arteria", grupo:"Antebrazo y mano", nombre:"Arteria radial", latin:"Arteria radialis",
  resumen:"Rama lateral de la braquial. En la muñeca es la arteria del pulso; luego cruza al dorso y entra en la palma para formar el arco profundo.",

obturador_externo:{cat:"musculo", capa:"Profundo", grupo:"Rotadores laterales de la cadera", nombre:"Obturador externo", latin:"Musculus obturatorius externus",

psoas_mayor:{cat:"musculo", capa:"Profundo", grupo:"Iliopsoas", nombre:"Psoas mayor", latin:"Musculus psoas major",

sartorio:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior del muslo", nombre:"Sartorio", latin:"Musculus sartorius",

recto_femoral:{cat:"musculo", capa:"Superficial", grupo:"Cuádriceps femoral", nombre:"Recto femoral", latin:"Musculus rectus femoris",

vasto_lateral:{cat:"musculo", capa:"Superficial", grupo:"Cuádriceps femoral", nombre:"Vasto lateral", latin:"Musculus vastus lateralis",

vasto_medial:{cat:"musculo", capa:"Superficial", grupo:"Cuádriceps femoral", nombre:"Vasto medial", latin:"Musculus vastus medialis",

vasto_intermedio:{cat:"musculo", capa:"Profundo", grupo:"Cuádriceps femoral", nombre:"Vasto intermedio", latin:"Musculus vastus intermedius",

pectineo:{cat:"musculo", capa:"Superficial", grupo:"Compartimento medial del muslo", nombre:"Pectíneo", latin:"Musculus pectineus",

aductor_largo:{cat:"musculo", capa:"Superficial", grupo:"Compartimento medial del muslo", nombre:"Aductor largo", latin:"Musculus adductor longus",

aductor_mayor:{cat:"musculo", capa:"Profundo", grupo:"Compartimento medial del muslo", nombre:"Aductor mayor", latin:"Musculus adductor magnus",

biceps_femoral:{cat:"musculo", capa:"Superficial", grupo:"Isquiotibiales", nombre:"Bíceps femoral", latin:"Musculus biceps femoris",

/* ================= CADERA: LIGAMENTOS ================= */
lig_iliofemoral:{cat:"ligamento", grupo:"Articulación de la cadera", nombre:"Ligamento iliofemoral", latin:"Ligamentum iliofemorale",
  resumen:"El ligamento más fuerte del cuerpo, en forma de «Y» invertida, en la cara anterior de la cadera.",
  une:"Espina ilíaca anteroinferior y borde del acetábulo con la línea intertrocantérea del fémur.",
  funcion:"Impide que la cadera se extienda de más; permite estar de pie casi sin gastar energía muscular, «colgándose» de este ligamento.",
  clinica:"Por su fuerza, la mayoría de las luxaciones de cadera son posteriores. En la luxación congénita se estira y deja inestable la articulación."},
lig_pubofemoral:{cat:"ligamento", grupo:"Articulación de la cadera", nombre:"Ligamento pubofemoral", latin:"Ligamentum pubofemorale",
  resumen:"Refuerzo anteroinferior de la cápsula de la cadera.",
  une:"Rama superior del pubis y cresta obturatriz con la cápsula y la parte baja de la línea intertrocantérea.",
  funcion:"Limita la abducción y la extensión excesivas de la cadera.",
  clinica:"Con el iliofemoral forma una «Z» por delante de la cadera; entre ambos hay un punto débil por donde puede comunicarse la bolsa del iliopsoas."},
lig_isquiofemoral:{cat:"ligamento", grupo:"Articulación de la cadera", nombre:"Ligamento isquiofemoral", latin:"Ligamentum ischiofemorale",
  resumen:"Refuerzo posterior de la cápsula de la cadera, el más débil de los tres.",
  une:"Isquion, detrás del acetábulo, con el cuello del fémur cerca del trocánter mayor.",
  funcion:"Limita la rotación interna y la aducción de la cadera flexionada.",
  clinica:"Las luxaciones posteriores de cadera (golpe de rodilla contra el tablero del auto) lo desgarran y pueden lesionar el nervio ciático."},
rodete_acetabular:{cat:"ligamento", grupo:"Articulación de la cadera", nombre:"Rodete acetabular (labrum)", latin:"Labrum acetabuli",
  resumen:"Anillo de fibrocartílago que rodea el borde del acetábulo y lo hace más profundo.",
  une:"Borde del acetábulo; cierra la escotadura acetabular a través del ligamento transverso.",
  funcion:"Aumenta la superficie de contacto, sella la articulación y ayuda a mantener la cabeza femoral en su sitio.",
  clinica:"Sus roturas causan dolor en la ingle con chasquidos al girar; se asocian al choque femoroacetabular (pinzamiento) y se tratan por artroscopia."},
capsula_cadera:{cat:"ligamento", grupo:"Articulación de la cadera", nombre:"Cápsula de la cadera", latin:"Capsula articularis coxae",
  resumen:"Manguito fibroso muy fuerte que envuelve la cabeza y casi todo el cuello del fémur.",
  une:"Borde del acetábulo y ligamento transverso con la línea intertrocantérea (por delante) y el cuello del fémur (por detrás).",
  funcion:"Da estabilidad a la cadera; se refuerza con los ligamentos iliofemoral, pubofemoral e isquiofemoral. Por ella suben las arterias que irrigan la cabeza femoral.",
  clinica:"Las fracturas del cuello dentro de la cápsula rompen sus vasos y pueden dejar sin sangre la cabeza del fémur; por eso a menudo se colocan prótesis."},
lig_inguinal:{cat:"ligamento", grupo:"Pelvis", nombre:"Ligamento inguinal", latin:"Ligamentum inguinale",
  resumen:"Borde inferior engrosado de la aponeurosis del oblicuo externo, entre la cadera y el pubis. Marca el límite entre abdomen y muslo.",
  une:"Espina ilíaca anterosuperior con el tubérculo del pubis.",
  funcion:"Forma el techo del paso de músculos y vasos hacia el muslo y el suelo del conducto inguinal.",
  clinica:"Por debajo de su punto medio se palpa el pulso femoral. Las hernias inguinales salen por encima de él y las femorales por debajo, medial a la vena femoral."},
lig_sacrotuberoso:{cat:"ligamento", grupo:"Pelvis", nombre:"Ligamento sacrotuberoso", latin:"Ligamentum sacrotuberale",
  resumen:"Banda fuerte y ancha que va del sacro a la tuberosidad isquiática.",
  une:"Borde lateral del sacro y del cóccix y espinas ilíacas posteriores con la tuberosidad isquiática.",
  funcion:"Impide que el sacro se incline hacia delante con el peso del cuerpo y convierte, junto con el sacroespinoso, las escotaduras ciáticas en agujeros.",
  clinica:"Es el origen de parte del glúteo mayor; el nervio pudendo puede quedar atrapado entre este ligamento y el sacroespinoso."},
lig_sacroespinoso:{cat:"ligamento", grupo:"Pelvis", nombre:"Ligamento sacroespinoso", latin:"Ligamentum sacrospinale",
  resumen:"Ligamento triangular delgado entre el sacro y la espina isquiática.",
  une:"Borde lateral del sacro y del cóccix con la espina isquiática.",
  funcion:"Separa el agujero ciático mayor (por arriba) del menor (por abajo) y estabiliza la pelvis.",
  clinica:"Se usa en cirugía ginecológica para fijar la cúpula vaginal en el prolapso. La espina isquiática es la referencia para el bloqueo del nervio pudendo."},
tracto_iliotibial:{cat:"ligamento", grupo:"Muslo", nombre:"Tracto iliotibial", latin:"Tractus iliotibialis",
  resumen:"Engrosamiento largo y fuerte de la fascia lata por la cara lateral del muslo, desde la cadera hasta la tibia.",
  une:"Cresta ilíaca (recibe al tensor de la fascia lata y al glúteo mayor) con el tubérculo de Gerdy de la tibia.",
  funcion:"Estabiliza la cadera y la rodilla en extensión durante la marcha y la carrera.",
  clinica:"Síndrome de la banda iliotibial: dolor en la cara lateral de la rodilla por roce sobre el epicóndilo lateral, típico de corredores de fondo y ciclistas."},

n_femoral:{cat:"nervio", grupo:"Plexo lumbar", nombre:"Nervio femoral", latin:"Nervus femoralis",
