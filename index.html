  inerva:"Ilíaco, pectíneo, sartorio y cuádriceps; piel anterior del muslo y, por el nervio safeno, cara medial de la pierna y del pie.",
  clinica:"Su lesión impide extender la rodilla: la persona no puede subir escaleras y la rodilla se dobla al caminar. Se bloquea con anestesia en la ingle para operar la rodilla o el fémur."},
n_safeno:{cat:"nervio", grupo:"Plexo lumbar", nombre:"Nervio safeno", latin:"Nervus saphenus",
  resumen:"Rama sensitiva más larga del nervio femoral. Acompaña a la vena safena mayor por la pierna.",
  raices:"L3–L4, por el nervio femoral.",
  trayecto:"Baja por el conducto aductor junto a la arteria femoral, sale por la cara medial de la rodilla entre el sartorio y el grácil y recorre la cara medial de la pierna con la vena safena mayor hasta el borde medial del pie.",
  inerva:"Piel de la cara medial de la rodilla, de la pierna y del borde medial del pie (ramo infrarrotuliano para la rodilla).",
  clinica:"Puede lesionarse al extraer la vena safena para bypass o en cirugías de rodilla, con adormecimiento de la cara medial de la pierna."},
n_obturador:{cat:"nervio", grupo:"Plexo lumbar", nombre:"Nervio obturador", latin:"Nervus obturatorius",
  resumen:"Nervio del compartimento medial del muslo. Sale de la pelvis por el conducto obturador.",
  raices:"L2–L4 (divisiones anteriores).",
  trayecto:"Baja por el borde medial del psoas, recorre la pared lateral de la pelvis, cruza el conducto obturador y se divide en ramas anterior y posterior alrededor del aductor corto.",
  inerva:"Aductores largo, corto y mayor (parte aductora), grácil y obturador externo; piel de la cara medial del muslo.",
  clinica:"Puede lesionarse en cirugías de la pelvis o en partos difíciles: la pierna se va hacia fuera al caminar. El dolor de cadera puede sentirse en la rodilla porque este nervio inerva ambas articulaciones."},
n_cutaneo_femoral_lateral:{cat:"nervio", grupo:"Plexo lumbar", nombre:"Nervio cutáneo femoral lateral", latin:"Nervus cutaneus femoris lateralis",
  resumen:"Nervio sensitivo que sale de la pelvis junto a la espina ilíaca anterosuperior hacia la cara lateral del muslo.",
  raices:"L2–L3.",
  trayecto:"Cruza el músculo ilíaco hacia la espina ilíaca anterosuperior, pasa por debajo o a través del ligamento inguinal y baja por la cara lateral del muslo.",
  inerva:"Piel de la cara anterolateral del muslo.",
  clinica:"Meralgia parestésica: ardor y adormecimiento en la cara lateral del muslo por compresión junto a la espina ilíaca, con cinturones apretados, embarazo u obesidad."},
n_gluteo_superior:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio glúteo superior", latin:"Nervus gluteus superior",
  resumen:"Nervio motor que sale de la pelvis por encima del piriforme hacia los glúteos medio y menor.",
  raices:"L4–S1.",
  trayecto:"Sale por el agujero ciático mayor por encima del piriforme, con la arteria glútea superior, y corre entre los glúteos medio y menor hasta el tensor de la fascia lata.",
  inerva:"Glúteo medio, glúteo menor y tensor de la fascia lata.",
  clinica:"Su lesión (por inyecciones mal puestas o cirugía de cadera) produce marcha de Trendelenburg: la pelvis cae del lado contrario al apoyar."},
n_gluteo_inferior:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio glúteo inferior", latin:"Nervus gluteus inferior",
  resumen:"Nervio motor del glúteo mayor; sale de la pelvis por debajo del piriforme.",
  raices:"L5–S2.",
  trayecto:"Sale por el agujero ciático mayor por debajo del piriforme, junto al nervio ciático, y se ramifica en la cara profunda del glúteo mayor.",
  inerva:"Glúteo mayor.",
  clinica:"Su lesión dificulta levantarse de una silla y subir escaleras; al caminar el tronco se va hacia atrás para compensar."},
n_ciatico:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio ciático", latin:"Nervus ischiadicus",
  resumen:"El nervio más grueso y largo del cuerpo, del grosor de un dedo. En realidad son dos nervios (tibial y fibular común) envueltos juntos.",
  raices:"L4–S3.",
  trayecto:"Sale de la pelvis por el agujero ciático mayor, por debajo del piriforme; baja entre el trocánter mayor y la tuberosidad isquiática, bajo el glúteo mayor, y por la cara posterior del muslo bajo la cabeza larga del bíceps. Arriba del hueco poplíteo se divide en tibial y fibular común.",
  inerva:"Isquiotibiales y parte isquiotibial del aductor mayor; por sus ramas, todos los músculos de la pierna y del pie y casi toda su piel, excepto la cara medial.",
  clinica:"La «ciática» es dolor que baja por la parte posterior del muslo y la pierna, casi siempre por una hernia de disco L4–L5 o L5–S1 que comprime sus raíces. Se puede lesionar con inyecciones mal puestas en la nalga o en luxaciones posteriores de cadera."},

/* ================= CADERA: ARTERIAS Y VENAS ================= */
a_iliaca_externa:{cat:"arteria", grupo:"Pelvis", nombre:"Arteria ilíaca externa", latin:"Arteria iliaca externa",
  resumen:"Rama de la ilíaca común que baja por el borde de la pelvis y, al pasar bajo el ligamento inguinal, se llama arteria femoral.",
  origen:"Arteria ilíaca común, delante de la articulación sacroilíaca.",
  trayecto:"Sigue el borde medial del psoas mayor hasta el punto medio del ligamento inguinal.",
  ramas:"Epigástrica inferior y circunfleja ilíaca profunda.",
  irriga:"Pared abdominal baja y, por su continuación, todo el miembro inferior.",
  clinica:"En el trasplante de riñón la arteria del riñón nuevo se une a ella. La epigástrica inferior separa las hernias inguinales directas de las indirectas."},
a_iliaca_interna:{cat:"arteria", grupo:"Pelvis", nombre:"Arteria ilíaca interna", latin:"Arteria iliaca interna",
  resumen:"Arteria principal de la pelvis; baja dentro de ella y da ramas a los órganos pélvicos y a la región glútea.",
  origen:"Arteria ilíaca común, delante de la articulación sacroilíaca.",
  trayecto:"Desciende hacia el agujero ciático mayor y se divide en un tronco anterior (vísceras y obturatriz) y uno posterior (glútea superior).",
  ramas:"Glútea superior, glútea inferior, obturatriz, pudenda interna, vesicales, uterina o del conducto deferente, rectal media.",
  irriga:"Vejiga, recto, órganos genitales, músculos de la pelvis y región glútea.",
  clinica:"En hemorragias graves tras el parto o en fracturas de pelvis se puede ligar o embolizar porque la pelvis tiene muchas conexiones colaterales."},
a_glutea_superior:{cat:"arteria", grupo:"Región glútea", nombre:"Arteria glútea superior", latin:"Arteria glutea superior",
  resumen:"La rama más grande de la ilíaca interna; sale de la pelvis por encima del piriforme.",
  origen:"Tronco posterior de la arteria ilíaca interna.",
  trayecto:"Sale por el agujero ciático mayor por encima del piriforme y se divide en ramas superficial (glúteo mayor) y profunda (entre glúteos medio y menor).",
  ramas:"Rama superficial y rama profunda (superior e inferior).",
  irriga:"Glúteos mayor, medio y menor, y tensor de la fascia lata.",
  clinica:"Puede romperse en fracturas de pelvis que llegan a la escotadura ciática, con sangrado difícil de controlar."},
a_glutea_inferior:{cat:"arteria", grupo:"Región glútea", nombre:"Arteria glútea inferior", latin:"Arteria glutea inferior",
  resumen:"Rama de la ilíaca interna que sale por debajo del piriforme junto al nervio ciático.",
  origen:"Tronco anterior de la arteria ilíaca interna.",
  trayecto:"Sale por el agujero ciático mayor por debajo del piriforme y baja hacia la cara profunda del glúteo mayor y la parte alta del muslo.",
  ramas:"Musculares, arteria del nervio ciático y anastomosis cruzada con las circunflejas femorales.",
  irriga:"Glúteo mayor, rotadores laterales cortos, isquiotibiales proximales y nervio ciático.",
  clinica:"La «anastomosis cruzada» alrededor de la cadera permite que llegue sangre al muslo aunque se obstruya la femoral alta."},
a_obturatriz:{cat:"arteria", grupo:"Pelvis", nombre:"Arteria obturatriz", latin:"Arteria obturatoria",
  resumen:"Rama de la ilíaca interna que acompaña al nervio obturador hacia el muslo medial.",
  origen:"Tronco anterior de la arteria ilíaca interna (a veces de la epigástrica inferior).",
  trayecto:"Recorre la pared lateral de la pelvis, cruza el conducto obturador y se divide en ramas anterior y posterior.",
  ramas:"Ramas musculares y la arteria del ligamento redondo, que llega a la cabeza del fémur.",
  irriga:"Aductores, obturador externo y una pequeña parte de la cabeza femoral.",
  clinica:"Si nace de la epigástrica inferior (arteria obturatriz aberrante, «corona mortis»), corre cerca de las hernias femorales y puede sangrar mucho al operarlas."},
a_femoral:{cat:"arteria", grupo:"Muslo", nombre:"Arteria femoral", latin:"Arteria femoralis",
  resumen:"Arteria principal del miembro inferior. Se palpa en la ingle, en el punto medio del ligamento inguinal.",
  origen:"Continuación de la ilíaca externa al pasar bajo el ligamento inguinal.",
  trayecto:"Cruza el triángulo femoral, entra en el conducto aductor bajo el sartorio y atraviesa el hiato del aductor mayor, donde se convierte en arteria poplítea.",
  ramas:"Epigástrica superficial, circunfleja ilíaca superficial, pudendas externas, femoral profunda y genicular descendente.",
  irriga:"Todo el muslo y, por su continuación, la pierna y el pie.",
  clinica:"Es la vía más usada para cateterismos (angioplastias y coronariografías). La aterosclerosis la estrecha en el conducto aductor y causa dolor de pantorrilla al caminar (claudicación)."},
a_femoral_profunda:{cat:"arteria", grupo:"Muslo", nombre:"Arteria femoral profunda", latin:"Arteria profunda femoris",
  resumen:"La rama más grande de la femoral; irriga la mayor parte de los músculos del muslo.",
  origen:"Cara lateral o posterior de la arteria femoral, unos 4 cm debajo del ligamento inguinal.",
  trayecto:"Baja por detrás de los vasos femorales y del aductor largo, pegada al fémur.",
  ramas:"Circunflejas femorales medial y lateral y tres o cuatro arterias perforantes que atraviesan los aductores hacia la parte posterior.",
  irriga:"Aductores, isquiotibiales, cuádriceps y fémur.",
  clinica:"Si se obstruye la femoral, sus ramas se conectan con las de la poplítea y mantienen viva la pierna (circulación colateral)."},
a_circunfleja_femoral_medial:{cat:"arteria", grupo:"Muslo", nombre:"Arteria circunfleja femoral medial", latin:"Arteria circumflexa femoris medialis",
  resumen:"Arteria que rodea el cuello del fémur por detrás; es la que más sangre lleva a la cabeza femoral.",
  origen:"Arteria femoral profunda (a veces la femoral).",
  trayecto:"Pasa entre el iliopsoas y el pectíneo, rodea el fémur por detrás y sube por el cuello hacia la cabeza (arterias retinaculares).",
  ramas:"Musculares, acetabular y ramas retinaculares para la cabeza y el cuello femoral.",
  irriga:"Cabeza y cuello del fémur, aductores y rotadores profundos.",
  clinica:"Se rompe en las fracturas desplazadas del cuello femoral y puede causar necrosis de la cabeza del fémur."},
a_circunfleja_femoral_lateral:{cat:"arteria", grupo:"Muslo", nombre:"Arteria circunfleja femoral lateral", latin:"Arteria circumflexa femoris lateralis",
  resumen:"Arteria que rodea el fémur por delante bajo el recto femoral; su rama descendente baja por el vasto lateral.",
  origen:"Arteria femoral profunda.",
  trayecto:"Va hacia lateral por delante del fémur, bajo el sartorio y el recto femoral, y da ramas ascendente, transversa y descendente.",
  ramas:"Ascendente (hacia el trocánter), transversa y descendente (hasta la rodilla).",
  irriga:"Cuádriceps, tensor de la fascia lata y trocánter mayor.",
  clinica:"Su rama descendente nutre el colgajo anterolateral del muslo, muy usado para reconstruir heridas de cabeza, cuello y extremidades."},
v_femoral:{cat:"vena", grupo:"Venas profundas", nombre:"Vena femoral", latin:"Vena femoralis",
  resumen:"Vena profunda principal del muslo; corre junto a la arteria femoral, medial a ella en la ingle.",
  trayecto:"Continúa a la vena poplítea desde el hiato del aductor, sube por el conducto aductor y el triángulo femoral y, bajo el ligamento inguinal, se convierte en ilíaca externa.",
  drena:"Vena ilíaca externa; recibe a la femoral profunda y a la safena mayor.",
  clinica:"Es el sitio típico de trombosis venosa profunda, que puede soltar coágulos al pulmón (embolia pulmonar). En la ingle se canaliza para catéteres centrales, medial al pulso femoral."},
v_safena_magna:{cat:"vena", grupo:"Venas superficiales", nombre:"Vena safena mayor", latin:"Vena saphena magna",
  resumen:"La vena más larga del cuerpo; sube por la cara medial de toda la pierna y el muslo, bajo la piel.",
  trayecto:"Nace del arco venoso dorsal del pie, pasa por delante del maléolo medial, sube por la cara medial de la pierna, detrás del cóndilo medial de la rodilla y por la cara medial del muslo hasta el hiato safeno, en la ingle.",
  drena:"Vena femoral, unos 3–4 cm por debajo del ligamento inguinal.",
  clinica:"Sus válvulas pueden fallar y causar várices. Se usa como injerto para puentes coronarios (bypass). Delante del maléolo medial es un sitio seguro para canalizar en emergencias."},

/* ================= RODILLA, PIERNA Y PIE: MÚSCULOS ================= */
tibial_anterior:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior de la pierna", nombre:"Tibial anterior", latin:"Musculus tibialis anterior",
  resumen:"El músculo grande que se palpa junto a la espinilla. Levanta la punta del pie al caminar.",
  origen:"Cóndilo lateral y mitad superior de la cara lateral de la tibia, y membrana interósea.",
  insercion:"Cara medial y plantar del cuneiforme medial y base del 1.er metatarsiano.",
  inervacion:"Nervio fibular profundo (L4–L5).",
  irrigacion:"Arteria tibial anterior.",
  accion:"Flexiona el tobillo hacia arriba (dorsiflexión) e invierte el pie; sostiene el arco medial.",
  clinica:"Si falla (lesión del fibular profundo o de la raíz L5) aparece el pie caído: la punta del pie arrastra y la persona levanta mucho la rodilla al caminar (marcha en estepaje). Se inflama en las «periostitis» de corredores.",
  prueba:"Caminar sobre los talones o levantar el pie hacia arriba y adentro contra resistencia."},
extensor_largo_dedos:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior de la pierna", nombre:"Extensor largo de los dedos", latin:"Musculus extensor digitorum longus",
  resumen:"Músculo lateral al tibial anterior que manda cuatro tendones a los dedos 2 a 5.",
  origen:"Cóndilo lateral de la tibia, tres cuartos superiores de la cara anterior del peroné y membrana interósea.",
  insercion:"Falanges medias y distales de los dedos 2–5 por las expansiones extensoras.",
  inervacion:"Nervio fibular profundo (L5–S1).",
  irrigacion:"Arteria tibial anterior.",
  accion:"Extiende los dedos 2–5 y hace dorsiflexión del tobillo.",
  clinica:"Sus tendones se ven en el dorso del pie al levantar los dedos. Se afecta en el síndrome compartimental anterior de la pierna.",
  prueba:"Levantar los dedos pequeños contra resistencia."},
extensor_largo_hallux:{cat:"musculo", capa:"Profundo", grupo:"Compartimento anterior de la pierna", nombre:"Extensor largo del hallux", latin:"Musculus extensor hallucis longus",
  resumen:"Músculo delgado entre el tibial anterior y el extensor de los dedos que levanta el dedo gordo.",
  origen:"Parte media de la cara anterior del peroné y membrana interósea.",
  insercion:"Base de la falange distal del dedo gordo, por su cara dorsal.",
  inervacion:"Nervio fibular profundo (L5).",
  irrigacion:"Arteria tibial anterior.",
  accion:"Extiende el dedo gordo y ayuda a la dorsiflexión del tobillo.",
  clinica:"Es el mejor músculo para explorar la raíz L5: si no puede levantar el dedo gordo contra resistencia, sospechar hernia de disco L4–L5. La arteria dorsal del pie se palpa por fuera de su tendón.",
  prueba:"Levantar el dedo gordo contra resistencia."},
fibular_tercero:{cat:"musculo", capa:"Superficial", grupo:"Compartimento anterior de la pierna", nombre:"Fibular tercero", latin:"Musculus fibularis tertius",
  resumen:"Pequeño músculo, a veces ausente, que parece una quinta cabeza del extensor largo de los dedos.",
  origen:"Tercio inferior de la cara anterior del peroné y membrana interósea.",
  insercion:"Dorso de la base del 5.º metatarsiano.",
  inervacion:"Nervio fibular profundo (L5–S1).",
  irrigacion:"Arteria tibial anterior.",
  accion:"Dorsiflexión del tobillo y eversión del pie.",
  clinica:"Falta en cerca del 10 % de las personas; solo existe en humanos y se relaciona con la marcha bípeda.",
  prueba:"Levantar y girar hacia fuera el borde lateral del pie."},
fibular_largo:{cat:"musculo", capa:"Superficial", grupo:"Compartimento lateral de la pierna", nombre:"Fibular largo", latin:"Musculus fibularis longus",
  resumen:"Músculo lateral de la pierna cuyo tendón pasa por detrás del maléolo lateral y cruza toda la planta del pie.",
  origen:"Cabeza y dos tercios superiores de la cara lateral del peroné.",
  insercion:"Base del 1.er metatarsiano y cuneiforme medial, por la planta.",
  inervacion:"Nervio fibular superficial (L5–S2).",
  irrigacion:"Arterias tibial anterior y fibular.",
  accion:"Evierte el pie y hace flexión plantar; sostiene los arcos lateral y transverso como un estribo.",
  clinica:"Protege el tobillo de los esguinces por inversión; su debilidad favorece esguinces repetidos. Su tendón puede salirse de detrás del maléolo (luxación de los fibulares).",
  prueba:"Girar la planta del pie hacia fuera contra resistencia."},
fibular_corto:{cat:"musculo", capa:"Superficial", grupo:"Compartimento lateral de la pierna", nombre:"Fibular corto", latin:"Musculus fibularis brevis",
  resumen:"Músculo debajo del fibular largo cuyo tendón llega a la base del 5.º metatarsiano.",
  origen:"Dos tercios inferiores de la cara lateral del peroné.",
  insercion:"Tuberosidad de la base del 5.º metatarsiano.",
  inervacion:"Nervio fibular superficial (L5–S2).",
  irrigacion:"Arteria fibular.",
  accion:"Evierte el pie y ayuda a la flexión plantar.",
  clinica:"En un esguince fuerte de tobillo puede arrancar un trozo de la base del 5.º metatarsiano (fractura por avulsión). Su tendón se rompe longitudinalmente en tobillos inestables.",
  prueba:"Eversión del pie contra resistencia, palpando el tendón detrás del maléolo lateral."},
gastrocnemio:{cat:"musculo", capa:"Superficial", grupo:"Compartimento posterior de la pierna", nombre:"Gastrocnemio (gemelos)", latin:"Musculus gastrocnemius",
  resumen:"El músculo más superficial de la pantorrilla, con dos cabezas que forman su relieve. Con el sóleo forma el tríceps sural.",
  origen:"Cabeza medial: cara posterior del cóndilo medial del fémur. Cabeza lateral: cara lateral del cóndilo lateral.",
  insercion:"Tuberosidad del calcáneo por el tendón calcáneo (de Aquiles).",
  inervacion:"Nervio tibial (S1–S2).",
  irrigacion:"Arterias surales (ramas de la poplítea).",
  accion:"Flexión plantar del tobillo (ponerse de puntillas, impulsarse al correr y saltar) y flexión de la rodilla.",
  clinica:"El desgarro de su cabeza medial es la «pierna de tenista», un dolor como pedrada en la pantorrilla. La rotura del tendón de Aquiles deja sin poder ponerse de puntillas.",
  prueba:"Prueba de Thompson: boca abajo, al apretar la pantorrilla el pie debe moverse hacia abajo; si no se mueve, el tendón de Aquiles está roto."},
soleo:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Sóleo", latin:"Musculus soleus",
  resumen:"Músculo ancho y plano bajo el gastrocnemio. Trabaja casi todo el tiempo de pie y bombea la sangre de las venas de la pierna.",
  origen:"Cabeza y cara posterior del peroné, línea del sóleo de la tibia y arco tendinoso entre ambos.",
  insercion:"Tuberosidad del calcáneo por el tendón calcáneo.",
  inervacion:"Nervio tibial (S1–S2).",
  irrigacion:"Arterias poplítea, tibial posterior y fibular.",
  accion:"Flexión plantar del tobillo; mantiene la postura de pie evitando que el cuerpo caiga hacia delante.",
  clinica:"Es el «corazón periférico»: su contracción empuja la sangre venosa hacia arriba. La inmovilidad (viajes largos, cama) favorece las trombosis en sus venas.",
  prueba:"Ponerse de puntillas con la rodilla flexionada (así el gastrocnemio casi no ayuda)."},
plantar:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Plantar", latin:"Musculus plantaris",
  resumen:"Músculo de vientre pequeño y el tendón más largo del cuerpo, que baja entre el gastrocnemio y el sóleo.",
  origen:"Línea supracondílea lateral del fémur, sobre la cabeza lateral del gastrocnemio.",
  insercion:"Tuberosidad del calcáneo, medial al tendón calcáneo.",
  inervacion:"Nervio tibial (S1–S2).",
  irrigacion:"Arterias surales.",
  accion:"Ayuda débilmente a la flexión plantar y a la flexión de la rodilla.",
  clinica:"Falta en cerca del 10 % de las personas. Su tendón se usa como injerto. Su rotura imita un desgarro de pantorrilla.",
  prueba:"No se puede explorar aislado."},
popliteo:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Poplíteo", latin:"Musculus popliteus",
  resumen:"Músculo triangular en el fondo del hueco poplíteo. Es la «llave» que desbloquea la rodilla extendida.",
  origen:"Cara lateral del cóndilo lateral del fémur y menisco lateral.",
  insercion:"Cara posterior de la tibia, por encima de la línea del sóleo.",
  inervacion:"Nervio tibial (L4–S1).",
  irrigacion:"Arterias geniculares inferiores.",
  accion:"Rota la tibia hacia dentro (o el fémur hacia fuera) para iniciar la flexión de la rodilla extendida y bloqueada; tira del menisco lateral hacia atrás.",
  clinica:"Su tendinitis da dolor en la cara posterolateral de la rodilla al bajar cuestas.",
  prueba:"Sentado con la rodilla a 90°, rotar la pierna hacia dentro contra resistencia."},
tibial_posterior:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Tibial posterior", latin:"Musculus tibialis posterior",
  resumen:"El músculo más profundo de la pantorrilla. Su tendón pasa detrás del maléolo medial y sostiene el arco del pie.",
  origen:"Membrana interósea y caras posteriores vecinas de la tibia y el peroné.",
  insercion:"Tuberosidad del navicular y, por expansiones, cuneiformes, cuboides y bases de los metatarsianos 2.º a 4.º.",
  inervacion:"Nervio tibial (L4–L5).",
  irrigacion:"Arteria tibial posterior.",
  accion:"Invierte el pie y hace flexión plantar; es el principal sostén dinámico del arco longitudinal medial.",
  clinica:"Su disfunción (degeneración del tendón) es la causa más común de pie plano adquirido en adultos, sobre todo en mujeres mayores de 40.",
  prueba:"Pararse en un pie y subir de puntillas: el talón debe girar hacia dentro; si no puede, el tendón falla."},
flexor_largo_dedos:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Flexor largo de los dedos", latin:"Musculus flexor digitorum longus",
  resumen:"Músculo profundo medial de la pantorrilla que manda cuatro tendones a la punta de los dedos 2 a 5.",
  origen:"Cara posterior de la tibia, debajo de la línea del sóleo.",
  insercion:"Bases de las falanges distales de los dedos 2–5, por la planta.",
  inervacion:"Nervio tibial (S2–S3).",
  irrigacion:"Arteria tibial posterior.",
  accion:"Flexiona los dedos 2–5, ayuda a la flexión plantar y sostiene el arco longitudinal.",
  clinica:"Pasa detrás del maléolo medial en el túnel del tarso con el tibial posterior, el nervio tibial y el flexor largo del hallux. En la planta recibe al cuadrado plantar y da origen a los lumbricales.",
  prueba:"Doblar los dedos pequeños contra resistencia."},
flexor_largo_hallux:{cat:"musculo", capa:"Profundo", grupo:"Compartimento posterior de la pierna", nombre:"Flexor largo del hallux", latin:"Musculus flexor hallucis longus",
  resumen:"El más fuerte de los músculos profundos de la pantorrilla. Da el último impulso del paso con el dedo gordo.",
  origen:"Dos tercios inferiores de la cara posterior del peroné y membrana interósea.",
  insercion:"Base de la falange distal del dedo gordo, por la planta.",
  inervacion:"Nervio tibial (S2–S3).",
  irrigacion:"Arteria fibular.",
  accion:"Flexiona el dedo gordo, ayuda a la flexión plantar y sostiene el arco medial.",
  clinica:"Su tendinitis es frecuente en bailarinas de ballet («tendinitis de la bailarina»), detrás del tobillo, al trabajar en punta.",
  prueba:"Doblar el dedo gordo contra resistencia."},
extensor_corto_dedos:{cat:"musculo", capa:"Superficial", grupo:"Dorso del pie", nombre:"Extensor corto de los dedos", latin:"Musculus extensor digitorum brevis",
  resumen:"Único músculo del dorso del pie; se ve como un pequeño bulto delante del maléolo lateral. Su parte medial es el extensor corto del hallux.",
  origen:"Cara superolateral del calcáneo y retináculo extensor inferior.",
  insercion:"Base de la falange proximal del dedo gordo (extensor corto del hallux) y tendones del extensor largo de los dedos 2–4.",
  inervacion:"Nervio fibular profundo (S1–S2).",
  irrigacion:"Arterias dorsal del pie y tarsiana lateral.",
  accion:"Extiende los dedos 1–4.",
  clinica:"Su bulto puede confundirse con un hematoma tras un esguince. Se usa como prueba de la función del fibular profundo en estudios de nervios.",
  prueba:"Levantar los dedos y palpar el bulto delante del maléolo lateral."},
abductor_hallux:{cat:"musculo", capa:"Superficial", grupo:"Planta del pie · 1.ª capa", nombre:"Abductor del hallux", latin:"Musculus abductor hallucis",
  resumen:"Músculo superficial que forma el borde medial de la planta del pie.",
  origen:"Apófisis medial de la tuberosidad del calcáneo, retináculo flexor y aponeurosis plantar.",
  insercion:"Lado medial de la base de la falange proximal del dedo gordo.",
  inervacion:"Nervio plantar medial (S1–S2).",
  irrigacion:"Arteria plantar medial.",
  accion:"Separa el dedo gordo (abducción), lo flexiona y sostiene el arco medial.",
  clinica:"El nervio tibial y sus ramas plantares pasan bajo él; su borde puede comprimirlos en el síndrome del túnel del tarso. En el hallux valgus pierde fuerza y se desplaza hacia la planta.",
  prueba:"Separar el dedo gordo de los demás."},
flexor_corto_dedos:{cat:"musculo", capa:"Superficial", grupo:"Planta del pie · 1.ª capa", nombre:"Flexor corto de los dedos", latin:"Musculus flexor digitorum brevis",
  resumen:"Músculo central de la primera capa de la planta, justo sobre la fascia plantar.",
  origen:"Apófisis medial de la tuberosidad del calcáneo y aponeurosis plantar.",
  insercion:"Lados de las falanges medias de los dedos 2–5 (cada tendón se abre para dejar pasar al flexor largo).",
  inervacion:"Nervio plantar medial (S1–S2).",
  irrigacion:"Arterias plantares medial y lateral.",
  accion:"Flexiona los dedos 2–5 y sostiene el arco longitudinal.",
  clinica:"Comparte origen con la fascia plantar; su tensión contribuye al dolor de talón.",
  prueba:"Doblar los dedos pequeños sujetando las puntas extendidas."},
abductor_quinto_dedo:{cat:"musculo", capa:"Superficial", grupo:"Planta del pie · 1.ª capa", nombre:"Abductor del quinto dedo", latin:"Musculus abductor digiti minimi pedis",
  resumen:"Músculo superficial que forma el borde lateral de la planta.",
  origen:"Apófisis medial y lateral de la tuberosidad del calcáneo y aponeurosis plantar.",
  insercion:"Lado lateral de la base de la falange proximal del 5.º dedo.",
  inervacion:"Nervio plantar lateral (S2–S3).",
  irrigacion:"Arteria plantar lateral.",
  accion:"Separa y flexiona el 5.º dedo; sostiene el arco lateral.",
  clinica:"El primer ramo del nervio plantar lateral (nervio de Baxter) puede comprimirse cerca de él y causar dolor de talón que no mejora.",
  prueba:"Separar el dedo pequeño."},
cuadrado_plantar:{cat:"musculo", capa:"Profundo", grupo:"Planta del pie · 2.ª capa", nombre:"Cuadrado plantar", latin:"Musculus quadratus plantae",
  resumen:"Músculo cuadrado que tira del tendón del flexor largo de los dedos para que flexione en línea recta.",
  origen:"Caras medial y lateral de la cara plantar del calcáneo (dos cabezas).",
  insercion:"Borde lateral del tendón del flexor largo de los dedos.",
  inervacion:"Nervio plantar lateral (S2–S3).",
  irrigacion:"Arteria plantar lateral.",
  accion:"Corrige la tracción oblicua del flexor largo de los dedos y ayuda a flexionar los dedos 2–5.",
  clinica:"Es útil para flexionar los dedos cuando el tobillo está en flexión plantar y el flexor largo pierde fuerza.",
  prueba:"No se explora aislado."},
lumbricales_pie:{cat:"musculo", capa:"Profundo", grupo:"Planta del pie · 2.ª capa", nombre:"Lumbricales del pie", latin:"Musculi lumbricales pedis",
  resumen:"Cuatro músculos pequeños que nacen de los tendones del flexor largo de los dedos.",
  origen:"Tendones del flexor largo de los dedos.",
  insercion:"Lado medial de las expansiones extensoras de los dedos 2–5.",
  inervacion:"1.º: nervio plantar medial; 2.º a 4.º: nervio plantar lateral (S2–S3).",
  irrigacion:"Arco plantar y arterias metatarsianas plantares.",
  accion:"Flexionan las metatarsofalángicas y extienden las interfalángicas, manteniendo los dedos apoyados al caminar.",
  clinica:"Su debilidad (por ejemplo en neuropatía diabética) favorece los dedos en garra.",
  prueba:"Flexionar los dedos en las metatarsofalángicas con los dedos rectos."},
flexor_corto_hallux:{cat:"musculo", capa:"Profundo", grupo:"Planta del pie · 3.ª capa", nombre:"Flexor corto del hallux", latin:"Musculus flexor hallucis brevis",
  resumen:"Músculo de dos cabezas bajo el 1.er metatarsiano; cada cabeza lleva un hueso sesamoideo.",
  origen:"Cara plantar del cuboides y del cuneiforme lateral.",
  insercion:"Ambos lados de la base de la falange proximal del dedo gordo, por los sesamoideos.",
  inervacion:"Nervio plantar medial (S1–S2).",
  irrigacion:"Arteria plantar medial.",
  accion:"Flexiona la metatarsofalángica del dedo gordo.",
  clinica:"La sesamoiditis (inflamación de sus sesamoideos) da dolor bajo la cabeza del 1.er metatarsiano en bailarines y corredores.",
  prueba:"Flexionar el dedo gordo en su base."},
aductor_hallux:{cat:"musculo", capa:"Profundo", grupo:"Planta del pie · 3.ª capa", nombre:"Aductor del hallux", latin:"Musculus adductor hallucis",
  resumen:"Músculo profundo con una cabeza oblicua y otra transversa que acercan el dedo gordo a los demás.",
  origen:"Cabeza oblicua: bases de los metatarsianos 2.º a 4.º. Cabeza transversa: ligamentos plantares de las metatarsofalángicas 3.ª a 5.ª.",
  insercion:"Lado lateral de la base de la falange proximal del dedo gordo.",
  inervacion:"Ramo profundo del nervio plantar lateral (S2–S3).",
  irrigacion:"Arco plantar.",
  accion:"Acerca el dedo gordo al segundo dedo y sostiene el arco transverso.",
  clinica:"En el hallux valgus (juanete) tira del dedo gordo hacia los otros dedos; en la cirugía del juanete se libera su tendón.",
  prueba:"No se explora aislado con facilidad."},
interoseos_pie:{cat:"musculo", capa:"Profundo", grupo:"Planta del pie · 4.ª capa", nombre:"Interóseos del pie", latin:"Musculi interossei pedis",
  resumen:"Siete músculos entre los metatarsianos: cuatro dorsales y tres plantares, con el 2.º dedo como eje.",
  origen:"Dorsales: lados vecinos de los metatarsianos. Plantares: cara medial de los metatarsianos 3.º a 5.º.",
  insercion:"Bases de las falanges proximales y expansiones extensoras de los dedos 2–5.",
  inervacion:"Nervio plantar lateral (S2–S3).",
  irrigacion:"Arterias metatarsianas dorsales y plantares.",
  accion:"Los dorsales separan los dedos del eje del 2.º dedo; los plantares los acercan. Todos ayudan a flexionar las metatarsofalángicas.",
  clinica:"Entre los metatarsianos 3.º y 4.º puede formarse el neuroma de Morton, un engrosamiento del nervio digital que duele como pisar una piedra.",
  prueba:"Separar y juntar los dedos del pie."},

/* ================= RODILLA, PIERNA Y PIE: LIGAMENTOS ================= */
lig_cruzado_anterior:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Ligamento cruzado anterior", latin:"Ligamentum cruciatum anterius",
  resumen:"Ligamento dentro de la rodilla que va de delante en la tibia a atrás en el fémur. Es el que más se rompe.",
  une:"Área intercondílea anterior de la tibia con la cara medial del cóndilo lateral del fémur.",
  funcion:"Impide que la tibia se deslice hacia delante y controla la rotación de la rodilla.",
  clinica:"Se rompe al girar o frenar con el pie fijo (fútbol, básquetbol, esquí): se escucha un «pop» y la rodilla se hincha en horas. Se diagnostica con las pruebas de Lachman y del cajón anterior y se reconstruye con injertos de tendón."},
lig_cruzado_posterior:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Ligamento cruzado posterior", latin:"Ligamentum cruciatum posterius",
  resumen:"El ligamento más grueso de la rodilla; cruza por detrás del cruzado anterior.",
  une:"Área intercondílea posterior de la tibia con la cara lateral del cóndilo medial del fémur.",
  funcion:"Impide que la tibia se vaya hacia atrás; es el eje de la rodilla en flexión.",
  clinica:"Se rompe al golpear la rodilla flexionada contra el tablero del auto o al caer sobre ella. Prueba del cajón posterior: la tibia se hunde hacia atrás."},
lig_colateral_tibial:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Ligamento colateral tibial (medial)", latin:"Ligamentum collaterale tibiale",
  resumen:"Banda ancha y plana en la cara medial de la rodilla, unida al menisco medial.",
  une:"Epicóndilo medial del fémur con la cara medial de la tibia y el menisco medial.",
  funcion:"Impide que la rodilla se abra hacia dentro (valgo).",
  clinica:"Se lesiona con golpes en la cara lateral de la rodilla. La «tríada desgraciada» combina rotura de este ligamento, del cruzado anterior y del menisco. Suele curar sin cirugía."},
lig_colateral_fibular:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Ligamento colateral fibular (lateral)", latin:"Ligamentum collaterale fibulare",
  resumen:"Cordón redondo en la cara lateral de la rodilla, separado del menisco lateral.",
  une:"Epicóndilo lateral del fémur con la cabeza del peroné.",
  funcion:"Impide que la rodilla se abra hacia fuera (varo).",
  clinica:"Se palpa como un cordón con la pierna cruzada en «4». Sus lesiones suelen ser parte de lesiones graves de la esquina posterolateral."},
menisco_medial:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Menisco medial", latin:"Meniscus medialis",
  resumen:"Fibrocartílago en forma de «C» abierta sobre la meseta tibial medial. Está fijo al ligamento colateral tibial.",
  une:"Áreas intercondíleas anterior y posterior de la tibia; borde externo unido a la cápsula y al ligamento colateral tibial.",
  funcion:"Amortigua y reparte la carga, aumenta el ajuste entre fémur y tibia y estabiliza la rodilla.",
  clinica:"Se rompe más que el lateral porque está fijo y se mueve menos. Da dolor en la línea articular medial, bloqueos y derrames. Prueba de McMurray: chasquido doloroso al girar la rodilla flexionada."},
menisco_lateral:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Menisco lateral", latin:"Meniscus lateralis",
  resumen:"Fibrocartílago casi circular sobre la meseta tibial lateral, más móvil que el medial.",
  une:"Áreas intercondíleas de la tibia; unido al tendón del poplíteo y, por los ligamentos meniscofemorales, al fémur.",
  funcion:"Amortigua y reparte la carga del compartimento lateral de la rodilla.",
  clinica:"Se lesiona menos que el medial por su movilidad. A veces es un menisco discoideo (redondo completo) que se rompe en niños con chasquidos."},
lig_rotuliano:{cat:"ligamento", grupo:"Articulación de la rodilla", nombre:"Ligamento rotuliano", latin:"Ligamentum patellae",
  resumen:"Continuación del tendón del cuádriceps desde la rótula hasta la tibia. Es el que se golpea en el reflejo de la rodilla.",
  une:"Vértice de la rótula con la tuberosidad de la tibia.",
  funcion:"Transmite la fuerza del cuádriceps a la tibia para extender la rodilla.",
  clinica:"El reflejo rotuliano explora las raíces L3–L4. La «rodilla de saltador» es su tendinopatía. Su tercio central se usa como injerto para el cruzado anterior."},
lig_deltoideo:{cat:"ligamento", grupo:"Articulación del tobillo", nombre:"Ligamento deltoideo (colateral medial)", latin:"Ligamentum deltoideum",
  resumen:"Ligamento muy fuerte en forma de abanico en la cara medial del tobillo.",
  une:"Maléolo medial con el navicular, el astrágalo y el sustentáculo del calcáneo (porciones tibionavicular, tibiocalcánea y tibioastragalinas).",
  funcion:"Impide que el pie se vaya hacia fuera (eversión) y sostiene la cara medial del tobillo.",
  clinica:"Es tan fuerte que, en vez de romperse, a menudo arranca el maléolo medial (fractura por avulsión) en torceduras hacia fuera."},
lig_talofibular_anterior:{cat:"ligamento", grupo:"Articulación del tobillo", nombre:"Ligamento talofibular anterior", latin:"Ligamentum talofibulare anterius",
  resumen:"El ligamento más débil del lado lateral del tobillo y el que más se lesiona.",
  une:"Borde anterior del maléolo lateral con el cuello del astrágalo.",
  funcion:"Limita la inversión y el desplazamiento del astrágalo hacia delante, sobre todo con el pie en punta.",
  clinica:"Se rompe en el esguince típico al torcerse el pie hacia dentro (más del 80 % de los esguinces). Prueba del cajón anterior del tobillo: el pie se desliza hacia delante."},
lig_calcaneofibular:{cat:"ligamento", grupo:"Articulación del tobillo", nombre:"Ligamento calcaneofibular", latin:"Ligamentum calcaneofibulare",
  resumen:"Cordón lateral que va del maléolo lateral al calcáneo, bajo los tendones fibulares.",
  une:"Vértice del maléolo lateral con la cara lateral del calcáneo.",
  funcion:"Limita la inversión del tobillo y de la articulación subastragalina.",
  clinica:"Se lesiona en esguinces más fuertes, después del talofibular anterior."},
lig_talofibular_posterior:{cat:"ligamento", grupo:"Articulación del tobillo", nombre:"Ligamento talofibular posterior", latin:"Ligamentum talofibulare posterius",
  resumen:"El más fuerte de los ligamentos laterales del tobillo, casi horizontal por detrás.",
  une:"Fosa del maléolo lateral con la apófisis posterior del astrágalo.",
  funcion:"Impide que el astrágalo se desplace hacia atrás y la rotación externa excesiva.",
  clinica:"Rara vez se rompe salvo en luxaciones completas del tobillo."},
lig_tibiofibular_anterior:{cat:"ligamento", grupo:"Sindesmosis tibioperonea", nombre:"Ligamento tibiofibular anterior inferior", latin:"Ligamentum tibiofibulare anterius",
  resumen:"Ligamento oblicuo que une la tibia y el peroné por delante, justo arriba del tobillo.",
  une:"Borde anterior de la tibia distal con el maléolo lateral.",
  funcion:"Mantiene unidos tibia y peroné para que formen una pinza firme alrededor del astrágalo.",
  clinica:"Su lesión es el «esguince alto de tobillo», frecuente en futbolistas y esquiadores: tarda más en curar y a veces requiere tornillos."},
fascia_plantar:{cat:"ligamento", grupo:"Planta del pie", nombre:"Aponeurosis (fascia) plantar", latin:"Aponeurosis plantaris",
  resumen:"Lámina fibrosa gruesa bajo la piel de la planta, desde el talón hasta los dedos. Sostiene el arco como la cuerda de un arco.",
  une:"Apófisis medial de la tuberosidad del calcáneo con las bases de los cinco dedos.",
  funcion:"Mantiene el arco longitudinal y, al levantar los dedos al final del paso, lo tensa como un torno (mecanismo de molinete).",
  clinica:"Fascitis plantar: dolor en el talón con los primeros pasos de la mañana o tras estar sentado, en corredores, personas con sobrepeso o que pasan mucho tiempo de pie. La fibromatosis plantar forma nódulos en ella."},
lig_calcaneonavicular_plantar:{cat:"ligamento", grupo:"Planta del pie", nombre:"Ligamento calcaneonavicular plantar (resorte)", latin:"Ligamentum calcaneonaviculare plantare",
  resumen:"Ligamento grueso y elástico bajo la cabeza del astrágalo, llamado ligamento «resorte» (spring).",
  une:"Sustentáculo del astrágalo del calcáneo con la cara plantar del navicular.",
  funcion:"Forma una hamaca que sostiene la cabeza del astrágalo y el arco longitudinal medial.",
  clinica:"Su estiramiento, junto con la falla del tibial posterior, deja caer la cabeza del astrágalo y produce pie plano."},
retinaculo_extensores_pie:{cat:"ligamento", grupo:"Tobillo", nombre:"Retináculos extensores del pie", latin:"Retinacula musculorum extensorum pedis",
  resumen:"Dos bandas fibrosas por delante del tobillo, superior e inferior (en forma de «Y»), que sujetan los tendones extensores.",
  une:"Retináculo superior: borde anterior de la tibia con el del peroné, arriba del tobillo. Inferior: calcáneo con el maléolo medial y la aponeurosis plantar.",
  funcion:"Evitan que los tendones del tibial anterior, extensores y fibular tercero se separen del tobillo al hacer dorsiflexión.",
  clinica:"Bajo el retináculo inferior puede comprimirse el nervio fibular profundo (síndrome del túnel del tarso anterior), por zapatos o botas apretadas."},

/* ================= RODILLA, PIERNA Y PIE: NERVIOS ================= */
n_tibial:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio tibial", latin:"Nervus tibialis",
  resumen:"La división más grande del ciático. Cruza el hueco poplíteo por el centro y baja por la parte posterior de la pierna hasta la planta.",
  raices:"L4–S3.",
  trayecto:"Cruza el centro del hueco poplíteo, pasa entre las cabezas del gastrocnemio y bajo el arco del sóleo, baja con la arteria tibial posterior y pasa detrás del maléolo medial (túnel del tarso), donde se divide en nervios plantares medial y lateral.",
  inerva:"Músculos de la parte posterior de la pierna (tríceps sural, plantar, poplíteo, tibial posterior, flexores largos) y, por sus ramas plantares, los músculos de la planta y la piel de la planta.",
  clinica:"Su lesión impide ponerse de puntillas y deja la planta sin sensibilidad. El síndrome del túnel del tarso es su compresión detrás del maléolo medial, con ardor en la planta. El reflejo aquíleo explora la raíz S1."},
n_plantares:{cat:"nervio", grupo:"Nervios del pie", nombre:"Nervios plantares medial y lateral", latin:"Nervi plantares medialis et lateralis",
  resumen:"Las dos ramas terminales del nervio tibial en la planta, parecidas a los nervios mediano y cubital de la mano.",
  raices:"L4–S3, por el nervio tibial.",
  trayecto:"Nacen detrás del maléolo medial, pasan bajo el abductor del hallux y corren por la planta: el medial hacia los dedos 1–3 y la mitad del 4.º, el lateral hacia el 4.º y el 5.º, con una rama profunda que cruza la planta.",
  inerva:"Medial: abductor del hallux, flexor corto de los dedos, flexor corto del hallux, 1.er lumbrical y piel medial de la planta. Lateral: el resto de los músculos plantares y la piel lateral de la planta.",
  clinica:"En la diabetes se afectan pronto, con pérdida de sensibilidad en la planta que favorece úlceras sin dolor. El neuroma de Morton es un engrosamiento de un nervio digital plantar entre las cabezas de los metatarsianos."},
n_fibular_comun:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio fibular común (peroneo)", latin:"Nervus fibularis communis",
  resumen:"La división lateral del ciático. Rodea el cuello del peroné justo bajo la piel, donde es muy vulnerable.",
  raices:"L4–S2.",
  trayecto:"Sigue el borde medial del bíceps femoral por el lado lateral del hueco poplíteo, rodea el cuello del peroné y se divide dentro del fibular largo en nervios fibular superficial y profundo.",
  inerva:"Cabeza corta del bíceps femoral; por sus ramas, los músculos anteriores y laterales de la pierna, el dorso del pie y la piel lateral de la pierna y del dorso del pie.",
  clinica:"Es el nervio del miembro inferior que más se lesiona: por fracturas del peroné, yesos, cruzar las piernas o estar acostado de lado mucho tiempo. Causa pie caído (no puede levantar la punta del pie ni girarlo hacia fuera)."},
n_fibular_superficial:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio fibular superficial", latin:"Nervus fibularis superficialis",
  resumen:"Rama del fibular común que inerva el compartimento lateral y la piel del dorso del pie.",
  raices:"L4–S1.",
  trayecto:"Baja entre los músculos fibulares, atraviesa la fascia en el tercio inferior de la pierna y se divide en ramas para el dorso del pie y los dedos.",
  inerva:"Fibulares largo y corto; piel de la parte baja de la pierna y casi todo el dorso del pie (salvo el primer espacio).",
  clinica:"Puede comprimirse donde atraviesa la fascia y dar ardor en el dorso del pie. Se lesiona en esguinces fuertes y en cirugías del tobillo."},
n_fibular_profundo:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio fibular profundo", latin:"Nervus fibularis profundus",
  resumen:"Rama del fibular común que inerva el compartimento anterior de la pierna y termina en el primer espacio entre los dedos.",
  raices:"L4–S1.",
  trayecto:"Atraviesa el extensor largo de los dedos, baja sobre la membrana interósea con la arteria tibial anterior, cruza el tobillo bajo el retináculo y llega al primer espacio interdigital.",
  inerva:"Tibial anterior, extensor largo de los dedos, extensor largo del hallux, fibular tercero y extensor corto de los dedos; piel del espacio entre el 1.er y el 2.º dedo.",
  clinica:"Su lesión produce pie caído y adormecimiento solo entre el dedo gordo y el segundo, que lo distingue de una lesión del fibular común. Se afecta en el síndrome compartimental anterior."},
n_sural:{cat:"nervio", grupo:"Plexo sacro", nombre:"Nervio sural", latin:"Nervus suralis",
  resumen:"Nervio sensitivo de la pantorrilla que acompaña a la vena safena menor hasta el borde lateral del pie.",
  raices:"S1–S2, por ramas de los nervios tibial y fibular común.",
  trayecto:"Baja por la línea media de la pantorrilla entre las cabezas del gastrocnemio, pasa detrás del maléolo lateral con la vena safena menor y sigue por el borde lateral del pie.",
  inerva:"Piel de la parte posterolateral de la pierna y del borde lateral del pie y el 5.º dedo.",
  clinica:"Es el nervio que se toma para biopsia en el estudio de neuropatías y como injerto para reparar otros nervios, porque su falta solo deja una pequeña zona adormecida."},

/* ================= RODILLA, PIERNA Y PIE: ARTERIAS Y VENAS ================= */
a_poplitea:{cat:"arteria", grupo:"Rodilla", nombre:"Arteria poplítea", latin:"Arteria poplitea",
  resumen:"Continuación de la arteria femoral detrás de la rodilla; es la estructura más profunda del hueco poplíteo.",
  origen:"Arteria femoral, al atravesar el hiato del aductor mayor.",
  trayecto:"Cruza el hueco poplíteo pegada a la cápsula de la rodilla y al fémur, y en el borde inferior del poplíteo se divide en tibial anterior y tibial posterior.",
  ramas:"Arterias geniculares superiores, media e inferiores (red alrededor de la rodilla) y arterias surales.",
  irriga:"Rodilla, gastrocnemio, sóleo y plantar; por sus ramas, toda la pierna y el pie.",
  clinica:"Se lesiona en luxaciones de rodilla: siempre hay que revisar los pulsos del pie. Su aneurisma es el más frecuente fuera del abdomen. Su pulso se toma con la rodilla flexionada."},
a_tibial_anterior:{cat:"arteria", grupo:"Pierna", nombre:"Arteria tibial anterior", latin:"Arteria tibialis anterior",
  resumen:"Rama de la poplítea que cruza la membrana interósea hacia el compartimento anterior de la pierna.",
  origen:"Arteria poplítea, en el borde inferior del poplíteo.",
  trayecto:"Pasa por encima de la membrana interósea hacia delante y baja sobre ella con el nervio fibular profundo; al cruzar el tobillo se llama arteria dorsal del pie.",
  ramas:"Recurrentes tibiales, musculares y maleolares anteriores.",
  irriga:"Compartimento anterior de la pierna y tobillo.",
  clinica:"En el síndrome compartimental anterior la presión de los músculos inflamados comprime sus ramas y puede dañar los músculos si no se abre la fascia a tiempo."},
a_dorsal_pie:{cat:"arteria", grupo:"Pie", nombre:"Arteria dorsal del pie (pedia)", latin:"Arteria dorsalis pedis",

/* --- lectura de respuestas en streaming (SSE) --- */
function leerSSE(r, onEv){
  function bloque(b){
    var data = b.split("\n").filter(function(l){ return l.indexOf("data:") === 0; }).map(function(l){ return l.slice(5).replace(/^ /, ""); }).join("\n");
    if(!data || data === "[DONE]") return; var j; try { j = JSON.parse(data); } catch(e){ return; } onEv(j);
  }
  if(!r.body || !r.body.getReader) return r.text().then(function(t){ t.replace(/\r/g, "").split("\n\n").forEach(bloque); });
  var rd = r.body.getReader(), dec = new TextDecoder(), buf = "";

    return rd.read().then(function(x){
      if(x.done){ if(buf.trim()) bloque(buf.replace(/\r/g, "")); return; }
      buf += dec.decode(x.value, {stream:true}).replace(/\r/g, "");
      var k; while((k = buf.indexOf("\n\n")) >= 0){ var b = buf.slice(0, k); buf = buf.slice(k + 2); bloque(b); }
      return pump();
    });
  }

}

  if(/location is not supported/i.test(m)) return "Gemini no está disponible desde tu ubicación. Prueba con Claude en Configurar.";
  if(/credit balance|billing/i.test(m)) return "Tu cuenta de Claude no tiene saldo. Agrega crédito en console.anthropic.com o usa Gemini gratis.";
  if(s === 403) return "La clave no tiene permiso para usar este modelo. Revisa que la creaste en Google AI Studio (o en la consola de Anthropic).";

    (lista.length ? '<div class="nlist">' + lista.map(function(k){ var d = DATA[k]; return '<button type="button" data-n="' + k + '"><span class="dot" style="--c:' + CATS[d.cat].color + ';margin-top:5px"></span><span><b>' + esc(d.nombre) + '</b><small>' + esc(notas[k].texto) + '</small></span><time>' + new Date(notas[k].actualizado).toLocaleDateString("es-MX", {day:"numeric", month:"short"}) + '</time></button>'; }).join("") + '</div>'
      : '<p style="color:var(--muted)">Aún no tienes notas. Toca una estructura y abre la pestaña <b>Mis notas</b> de su ficha.</p>') +
    '<div class="row"><button type="button" class="btn" id="exp">Descargar respaldo</button><label class="btn" style="cursor:pointer">Importar respaldo<input type="file" id="imp" accept=".json" hidden></label></div>' +
    '<p style="color:var(--faint);font-size:12px;margin:10px 0 0">El respaldo es un archivo .json con tus notas, por si quieres guardar una copia extra.</p>';
}
function htmlPaginas(){
  var a = REG.paginas;
  if(!a.length) return '<div class="empty2"><p>Aún no tienes páginas de estudio.</p><p class="sub2">Cada vez que armas láminas en <b>Imprimir</b>, se guardan aquí para que puedas volver a abrirlas, imprimirlas otra vez o estudiar sus estructuras.</p><div class="row" style="justify-content:center"><button type="button" class="btn pri" data-pa="nueva">Crear mi primera página</button></div></div>';
  return '<div class="pglist">' + a.map(function(pg){ var n = (pg.estructuras || []).length, v = (pg.vistas || []).length;
    return '<article class="pgc"><img src="' + esc(pg.miniatura || "") + '" alt=""><div class="pgi"><b>' + esc(pg.titulo || "Página de estudio") + '</b><small>' + new Date(pg.creada).toLocaleDateString("es-MX", {day:"numeric", month:"short", year:"numeric"}) + " · " + v + (v === 1 ? " vista" : " vistas") + " · " + n + ' estructuras</small>' +
      '<div class="pga"><button type="button" class="btn pri" data-pa="abrir" data-id="' + pg.id + '">Abrir</button><button type="button" class="btn" data-pa="estudiar" data-id="' + pg.id + '">Estudiar</button><button type="button" class="btn danger" data-pa="borrar" data-id="' + pg.id + '">Borrar</button></div></div></article>'; }).join("") + '</div>' +
    '<div class="row"><button type="button" class="btn" data-pa="nueva">Nueva página</button></div>';
}
function sumar(dias){
  var t = {min:0, quizOk:0, quizTotal:0, ia:0, paginas:0, fichas:{}, fallos:{}};
  dias.forEach(function(d){ if(!d) return; ["min", "quizOk", "quizTotal", "ia", "paginas"].forEach(function(k){ t[k] += +d[k] || 0; }); ["fichas", "fallos"].forEach(function(k){ var o = d[k] || {}; Object.keys(o).forEach(function(id){ t[k][id] = (t[k][id] || 0) + (+o[id] || 0); }); }); });
  return t;
}
function diaCon(k){ var d = REG.dias[k] ? JSON.parse(JSON.stringify(REG.dias[k])) : null; if(k === diaKey()){ var p = REG.pend; d = d || {}; ["min", "quizOk", "quizTotal", "ia", "paginas"].forEach(function(x){ d[x] = (+d[x] || 0) + p[x]; }); ["fichas", "fallos"].forEach(function(x){ d[x] = d[x] || {}; Object.keys(p[x]).forEach(function(id){ d[x][id] = (+d[x][id] || 0) + p[x][id]; }); }); } return d; }
function activo(d){ return d && ((+d.min || 0) > 0 || (+d.quizTotal || 0) > 0 || Object.keys(d.fichas || {}).length > 0); }
function htmlAvance(){
  var hoy = new Date(), ult = [], i;
  for(i = 13; i >= 0; i--){ var f = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - i); ult.push({k:diaKey(f), f:f, d:diaCon(diaKey(f))}); }
  var racha = 0; for(i = 0; i < 400; i++){ var k = diaKey(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - i)), d = diaCon(k); if(activo(d)) racha++; else if(i > 0) break; }
  var sem = sumar(ult.slice(-7).map(function(x){ return x.d; })), todo = sumar(Object.keys(REG.dias).filter(function(k){ return k !== diaKey(); }).map(function(k){ return REG.dias[k]; }).concat([diaCon(diaKey())]));
  var maxMin = Math.max(10, Math.max.apply(null, ult.map(function(x){ return x.d ? +x.d.min || 0 : 0; })));
  var pct = sem.quizTotal ? Math.round(sem.quizOk / sem.quizTotal * 100) + "%" : "—";
  var top = function(o, n){ return Object.keys(o).filter(function(id){ return DATA[id]; }).sort(function(a, b){ return o[b] - o[a]; }).slice(0, n); };
  var fallos = top(todo.fallos, 6), repas = top(todo.fichas, 8), nNotas = Object.keys(notas).filter(function(k){ return tieneNota(k); }).length;
  var dl = ["D", "L", "M", "M", "J", "V", "S"];
  return '<div class="kpis"><div><b>' + racha + '</b><span>' + (racha === 1 ? "día seguido" : "días seguidos") + '</span></div><div><b>' + sem.min + '</b><span>' + (sem.min === 1 ? "minuto" : "minutos") + ' esta semana</span></div><div><b>' + pct + '</b><span>aciertos esta semana</span></div><div><b>' + Object.keys(sem.fichas).length + '</b><span>fichas repasadas</span></div></div>' +
    '<div class="ph">Minutos de estudio · últimos 14 días</div><div class="bars" role="img" aria-label="Minutos de estudio por día">' + ult.map(function(x){ var m = x.d ? +x.d.min || 0 : 0; return '<div class="dbar' + (x.k === diaKey() ? " hoy" : "") + '" title="' + x.f.toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"short"}) + ": " + m + ' min"><i style="height:' + Math.max(m ? 6 : 2, m / maxMin * 100) + '%"></i><span>' + dl[x.f.getDay()] + '</span></div>'; }).join("") + '</div>' +
    '<div class="ph">Lo que más te cuesta</div>' + (fallos.length ? '<div class="rel">' + fallos.map(function(id){ return relBtn(id).replace("</button>", ' <small class="mono">×' + todo.fallos[id] + '</small></button>'); }).join("") + '</div><div class="row" style="margin-top:10px"><button type="button" class="btn pri" data-pa="repasar">Estudiar mis fallos</button></div>' : '<p class="sub2">Cuando falles una pregunta en el modo Estudiar, la estructura aparecerá aquí para repasarla.</p>') +
    '<div class="ph">Lo que más has repasado</div>' + (repas.length ? '<div class="rel">' + repas.map(relBtn).join("") + '</div>' : '<p class="sub2">Toca estructuras en el modelo para empezar tu registro.</p>') +
    '<div class="ph">En total</div><div class="tot"><span><b>' + todo.min + '</b> minutos</span><span><b>' + todo.quizTotal + '</b> preguntas de estudio</span><span><b>' + todo.ia + '</b> preguntas a la IA</span><span><b>' + REG.paginas.length + '</b> páginas</span><span><b>' + nNotas + '</b> notas</span></div>';
}
function clicEstudios(e){
  var n = e.target.closest("[data-n]"); if(n){ closeModal(); st.ftab = "notas"; select(n.dataset.n, true); st.ftab = "notas"; renderFicha(); if(mobile()) openSheet("right"); return; }
  var s = e.target.closest("[data-sel]"); if(s){ closeModal(); select(s.dataset.sel, true); if(mobile()) openSheet("right"); return; }
  if(e.target.closest("#exp")){ exportarNotas(); return; }
  var b = e.target.closest("[data-pa]"); if(!b) return;
  var pa = b.dataset.pa, pg = REG.paginas.filter(function(x){ return x.id === b.dataset.id; })[0];
  if(pa === "nueva"){ closeModal(); hojaImprimir(); return; }
  if(pa === "repasar"){ var t = sumar(Object.keys(REG.dias).map(function(k){ return REG.dias[k]; })).fallos; startStudy(Object.keys(t).sort(function(a, c){ return t[c] - t[a]; }).slice(0, 15)); return; }
  if(!pg) return;
  if(pa === "abrir"){ abrirPagina(pg); return; }
  if(pa === "estudiar"){ startStudy(pg.estructuras || []); return; }
  if(pa === "borrar"){
    if(b.dataset.ok !== "1"){ b.dataset.ok = "1"; b.textContent = "¿Seguro? Toca otra vez"; setTimeout(function(){ if(b.isConnected){ b.dataset.ok = ""; b.textContent = "Borrar"; } }, 3500); return; }
    track(raiz().collection("paginas").doc(pg.id).delete()).then(function(){ toast("Página borrada"); });
  }
}
function exportarNotas(){
  var blob = new Blob([JSON.stringify({app:"atlas-anatomico", version:2, usuario:usuarioDe(user.email), exportado:new Date().toISOString(), notas:notas}, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "notas-atlas-" + usuarioDe(user.email) + "-" + diaKey() + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast("Respaldo descargado");
}
function importarNotas(e){
  var f = e.target.files[0]; if(!f) return;
  f.text().then(function(t){ var d = JSON.parse(t), n = d.notas || {}, keys = Object.keys(n).filter(function(k){ return k === "_general" || DATA[k]; });
    if(!keys.length) throw new Error("El archivo no tiene notas del atlas");
    keys.forEach(function(k){ guardarNota(k, n[k].texto || ""); }); subirTodo();
    closeModal(); toast(keys.length + " notas importadas");
  }).catch(function(err){ toast("No se pudo importar: " + err.message); });
}

/* ---------- Firebase: carga sin módulos, con copia local para no perder nada ---------- */
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("No cargó " + src)); }; document.head.appendChild(s); }); }
function initFirebase(){
  var base = "https://www.gstatic.com/firebasejs/" + FBV + "/";
  var timeout = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("timeout")); }, 12000); });
  Promise.race([loadScript(base + "firebase-app-compat.js").then(function(){ return Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]); }), timeout]).then(function(){
    if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
    var db = firebase.firestore();
    try { db.enablePersistence({synchronizeTabs:true}).catch(function(e){ console.warn("Sin copia local de Firestore:", e.code); }); } catch(e){ console.warn(e); }
    fb = {auth:firebase.auth(), db:db};
    fbState = "listo";
    if(!user && !modal.hidden && modal.dataset.lock) hojaLogin();
    fb.auth.onAuthStateChanged(function(u){
      if(u){
        if(LS.get("atlas_uid", null) !== u.uid){ iaReiniciarLocal(); LS.set("atlas_uid", u.uid); }
        user = u;
        if(!modal.hidden && modal.dataset.lock){ modal.dataset.lock = ""; closeModal(); }
        renderUser(); cargarNotas(); regIniciar(); iaCuenta(u);
        track(raiz().set({usuario:usuarioDe(u.email), nombre:u.displayName || usuarioDe(u.email), ultimoAcceso:Date.now(), accesos:INC(1)}, {merge:true})).catch(function(){});
        toast("Hola, " + (u.displayName || usuarioDe(u.email)) + ". Todo lo que hagas se guarda en tu cuenta");
      } else {
        user = null; regDetener(); iaReiniciarLocal(); renderUser(); cargarNotas();
        if(STUDY.on) stopStudy();
        iaCerrar(); hojaLogin(ACC_MSG); ACC_MSG = null; denegando = false;
      }
    });
  }).catch(function(e){
    console.warn("Firebase no disponible:", e.message); fbState = "error"; renderUser(); hojaLogin();
  });
}

iaRender();
